<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语单词与阅读理解学习神器 · 中高考卡通科技版</title>
<style>
:root {
  --bg-main: #0b1220;
  --bg-card: #131c31;
  --bg-elevated: #1c2740;
  --bg-soft: #243047;
  --border: rgba(148, 180, 220, 0.18);
  --text: #f0f6ff;
  --text-sec: #94a8c4;
  --accent: #5eead4;
  --accent2: #a78bfa;
  --play: #38bdf8;
  --slow: #fbbf24;
  --success: #34d399;
  --warn: #fb7185;
  --junior: #38bdf8;
  --senior: #c084fc;
  --radius: 18px;
  --shadow: 0 8px 28px rgba(0,0,0,0.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: 
    radial-gradient(ellipse at 10% 0%, #1e3a5f 0%, transparent 45%),
    radial-gradient(ellipse at 90% 10%, #3b1f5e 0%, transparent 40%),
    var(--bg-main);
  color: var(--text);
  font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  min-height: 100vh;
  padding: 10px;
  display: flex;
  justify-content: center;
  line-height: 1.5;
}
.app {
  width: 100%;
  max-width: 1120px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, rgba(28,39,64,0.95), rgba(19,28,49,0.92));
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 14px 18px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
}
.title h1 {
  font-size: 1.32rem;
  font-weight: 900;
  background: linear-gradient(90deg, #5eead4, #7dd3fc, #c084fc, #f9a8d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0.3px;
}
.title p {
  font-size: 0.74rem;
  color: var(--text-sec);
  margin-top: 2px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.switch {
  display: flex;
  background: var(--bg-main);
  border-radius: 14px;
  border: 1px solid var(--border);
  overflow: hidden;
  padding: 3px;
}
.switch button {
  border: none;
  background: transparent;
  color: var(--text-sec);
  padding: 7px 14px;
  font-size: 0.8rem;
  font-weight: 800;
  cursor: pointer;
  border-radius: 11px;
  transition: all 0.2s;
}
.switch button.active {
  color: #fff;
  box-shadow: 0 2px 10px rgba(56,189,248,0.35);
}
.level-btn.active { background: linear-gradient(135deg, #0ea5e9, #6366f1); }
.level-btn.active.senior { background: linear-gradient(135deg, #a855f7, #ec4899); }
.mode-btn.active { background: linear-gradient(135deg, #14b8a6, #0ea5e9); }

/* ===== Main ===== */
.main {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 16px;
  min-height: 540px;
  box-shadow: var(--shadow);
}

/* Word toolbar */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.search {
  flex: 1;
  min-width: 150px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 9px 14px;
  color: #fff;
  font-size: 0.86rem;
  outline: none;
  transition: border 0.2s;
}
.search:focus { border-color: #5eead4; }
.search::placeholder { color: #64748b; }
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.pill {
  border: 1px solid rgba(148,180,220,0.22);
  background: var(--bg-elevated);
  color: #b8c9e0;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.18s;
}
.pill:hover, .pill.active {
  background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
  border-color: transparent;
  color: #fff;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(56,189,248,0.3);
}
.stats {
  font-size: 0.76rem;
  color: var(--text-sec);
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}

/* Word grid */
.word-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 11px;
  max-height: 620px;
  overflow-y: auto;
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: #334155 transparent;
}
.word-card {
  background: linear-gradient(160deg, var(--bg-elevated), #1a2438);
  border: 1px solid rgba(148,180,220,0.15);
  border-radius: 16px;
  padding: 13px 14px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.word-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, #5eead4, #38bdf8, #a78bfa);
  opacity: 0;
  transition: opacity 0.2s;
}
.word-card:hover {
  border-color: rgba(94,234,212,0.4);
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(14,165,233,0.15);
}
.word-card:hover::before { opacity: 1; }
.w-main {
  font-size: 1.28rem;
  font-weight: 900;
  color: #f8fafc;
  letter-spacing: 0.3px;
}
.w-ipa {
  font-size: 0.9rem;
  color: #5eead4;
  font-weight: 700;
  margin-top: 2px;
}
.w-cn {
  font-size: 0.84rem;
  color: #e2e8f0;
  margin: 5px 0 8px;
  font-weight: 600;
}
.w-ex {
  font-size: 0.78rem;
  background: rgba(56,189,248,0.08);
  border: 1px solid rgba(56,189,248,0.15);
  border-radius: 11px;
  padding: 8px 10px;
  margin-bottom: 9px;
  cursor: pointer;
  transition: all 0.15s;
  line-height: 1.5;
}
.w-ex:hover {
  background: rgba(56,189,248,0.16);
  border-color: rgba(56,189,248,0.35);
}
.w-ex .en { color: #cbd5e1; }
.w-ex .cn { color: #7c8da6; margin-top: 3px; font-size: 0.74rem; }
.w-ex .hint {
  font-size: 0.68rem;
  color: #5eead4;
  margin-top: 4px;
  opacity: 0.85;
}
.w-actions {
  display: flex;
  gap: 7px;
}
.btn {
  border: none;
  border-radius: 10px;
  padding: 7px 0;
  font-size: 0.76rem;
  font-weight: 800;
  color: #fff;
  cursor: pointer;
  flex: 1;
  transition: all 0.15s;
}
.btn:active { transform: scale(0.96); }
.btn-play {
  background: linear-gradient(135deg, #0ea5e9, #0284c7);
  box-shadow: 0 3px 10px rgba(14,165,233,0.3);
}
.btn-slow {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  box-shadow: 0 3px 10px rgba(245,158,11,0.3);
}

/* Article list */
.art-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 12px;
}
.art-card {
  background: linear-gradient(160deg, var(--bg-elevated), #1a2438);
  border: 1px solid rgba(148,180,220,0.15);
  border-radius: 16px;
  padding: 14px 15px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.art-card:hover {
  border-color: #5eead4;
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(94,234,212,0.12);
}
.art-card .t {
  font-size: 0.96rem;
  font-weight: 800;
  margin-bottom: 7px;
  color: #f1f5f9;
  line-height: 1.35;
}
.art-card .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 0.7rem;
}
.tag {
  background: rgba(167,139,250,0.18);
  color: #c4b5fd;
  padding: 2px 8px;
  border-radius: 8px;
  font-weight: 700;
}
.tag.words { background: rgba(56,189,248,0.15); color: #7dd3fc; }

/* Article detail */
.back {
  border: 1px solid rgba(148,180,220,0.3);
  background: transparent;
  color: #5eead4;
  padding: 7px 14px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 800;
  cursor: pointer;
  margin-bottom: 12px;
  transition: all 0.15s;
}
.back:hover { background: rgba(94,234,212,0.1); }
.art-title {
  font-size: 1.38rem;
  font-weight: 900;
  margin-bottom: 12px;
  background: linear-gradient(90deg, #5eead4, #7dd3fc, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.3;
}
.art-body {
  font-size: 0.96rem;
  line-height: 1.8;
  color: #e2e8f0;
  background: var(--bg-elevated);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 14px;
  white-space: pre-wrap;
  border: 1px solid rgba(148,180,220,0.1);
}
.hard {
  color: #fbbf24;
  font-weight: 800;
  border-bottom: 2.5px solid rgba(251,191,36,0.5);
  cursor: pointer;
  padding: 0 2px;
  border-radius: 4px;
  transition: all 0.15s;
}
.hard:hover {
  background: rgba(251,191,36,0.2);
  color: #fde68a;
}
.trans-box {
  background: linear-gradient(135deg, rgba(52,211,153,0.08), rgba(16,185,129,0.05));
  border: 1px solid rgba(52,211,153,0.25);
  border-radius: 14px;
  padding: 13px 15px;
  margin-bottom: 16px;
  font-size: 0.87rem;
  color: #a7f3d0;
  line-height: 1.7;
}
.trans-box h4 {
  color: #34d399;
  font-size: 0.84rem;
  margin-bottom: 6px;
  font-weight: 800;
}
.q-sec h3 {
  font-size: 1.08rem;
  margin-bottom: 12px;
  color: #e2e8f0;
  font-weight: 800;
}
.q-card {
  background: var(--bg-elevated);
  border: 1px solid rgba(148,180,220,0.14);
  border-radius: 14px;
  padding: 13px 14px;
  margin-bottom: 11px;
}
.q-text {
  font-size: 0.91rem;
  font-weight: 800;
  margin-bottom: 10px;
  color: #f1f5f9;
}
.q-opt {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 8px 11px;
  border-radius: 11px;
  cursor: pointer;
  margin-bottom: 4px;
  transition: all 0.15s;
  font-size: 0.85rem;
  border: 1px solid transparent;
}
.q-opt:hover { background: rgba(56,189,248,0.1); }
.q-opt.selected { background: rgba(14,165,233,0.18); border-color: #38bdf8; }
.q-opt.correct { background: rgba(52,211,153,0.18); border-color: #34d399; }
.q-opt.wrong { background: rgba(251,113,133,0.15); border-color: #fb7185; }
.q-opt input { margin-top: 3px; accent-color: #38bdf8; }
.check-btn {
  background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
  border: none;
  color: #fff;
  padding: 11px 22px;
  border-radius: 14px;
  font-size: 0.92rem;
  font-weight: 900;
  cursor: pointer;
  margin-top: 8px;
  box-shadow: 0 4px 16px rgba(139,92,246,0.3);
  transition: all 0.15s;
}
.check-btn:hover { transform: translateY(-1px); opacity: 0.95; }
.score-banner {
  display: none;
  background: linear-gradient(135deg, rgba(52,211,153,0.15), rgba(16,185,129,0.08));
  border: 1px solid rgba(52,211,153,0.35);
  border-radius: 14px;
  padding: 13px;
  margin-top: 12px;
  text-align: center;
  font-size: 1.08rem;
  font-weight: 900;
  color: #6ee7b7;
}

/* Popup */
.mask {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(4px);
}
.mask.show { display: flex; }
.popup {
  background: linear-gradient(160deg, #1e293b, #0f172a);
  border: 1px solid rgba(94,234,212,0.35);
  border-radius: 20px;
  padding: 20px 22px;
  max-width: 340px;
  width: 90%;
  text-align: center;
  box-shadow: 0 16px 48px rgba(0,0,0,0.5);
}
.p-word { font-size: 1.5rem; font-weight: 900; color: #f8fafc; }
.p-ipa { font-size: 1.1rem; color: #5eead4; margin: 7px 0; font-weight: 700; }
.p-cn { font-size: 1.05rem; color: #e2e8f0; margin-bottom: 14px; font-weight: 600; }
.p-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
.p-btns button {
  border: none;
  border-radius: 11px;
  padding: 9px 16px;
  font-size: 0.82rem;
  font-weight: 800;
  color: #fff;
  cursor: pointer;
}
.p-close {
  background: #475569;
  width: 100%;
  padding: 9px;
  border: none;
  border-radius: 11px;
  color: #fff;
  font-weight: 800;
  cursor: pointer;
  margin-top: 4px;
}
.empty {
  text-align: center;
  color: var(--text-sec);
  padding: 50px 20px;
  font-size: 0.92rem;
}
.view { display: none; }
.view.active { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">
      <h1>🚀 英语单词与阅读理解学习神器</h1>
      <p>中高考高频词汇 · 趣味科普短文 · 点击发音 · 护眼卡通科技风</p>
    </div>
    <div class="controls">
      <div class="switch">
        <button class="level-btn active" data-level="junior" onclick="setLevel('junior',this)">初中·中考</button>
        <button class="level-btn" data-level="senior" onclick="setLevel('senior',this)">高中·高考</button>
      </div>
      <div class="switch">
        <button class="mode-btn active" data-mode="words" onclick="setMode('words',this)">单词</button>
        <button class="mode-btn" data-mode="reading" onclick="setMode('reading',this)">阅读</button>
      </div>
    </div>
  </div>

  <div class="main">
    <!-- 单词 -->
    <div id="wordsPanel">
      <div class="toolbar">
        <input class="search" id="wordSearch" placeholder="🔍 搜索单词 / 中文释义..." oninput="filterWords()">
        <div class="pills" id="catPills"></div>
      </div>
      <div class="stats" id="wordStats">加载中...</div>
      <div class="word-grid" id="wordGrid"></div>
    </div>

    <!-- 阅读 -->
    <div id="readingPanel" style="display:none;">
      <div id="listView">
        <div class="toolbar">
          <div class="pills" id="artCatPills"></div>
        </div>
        <div class="stats" id="artStats"></div>
        <div class="art-list" id="artList"></div>
      </div>
      <div id="detailView" class="view">
        <button class="back" onclick="backToList()">← 返回文章列表</button>
        <div class="art-title" id="artTitle"></div>
        <div class="art-body" id="artBody"></div>
        <div class="trans-box">
          <h4>📖 中文翻译</h4>
          <div id="artTrans"></div>
        </div>
        <div class="q-sec">
          <h3>✏️ 阅读理解（认真作答）</h3>
          <div id="qBox"></div>
          <button class="check-btn" onclick="checkAnswers()">提交答案并查看解析</button>
          <div class="score-banner" id="scoreBanner"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="popup">
  <div class="popup">
    <div class="p-word" id="pWord"></div>
    <div class="p-ipa" id="pIpa"></div>
    <div class="p-cn" id="pCn"></div>
    <div class="p-btns">
      <button class="btn-play" onclick="speakPopup(0.95)">🔊 常速</button>
      <button class="btn-slow" onclick="speakPopup(0.58)">🐢 慢速</button>
    </div>
    <button class="p-close" onclick="closePopup()">关闭</button>
  </div>
</div>

<script>
/* ============================================================
   单词数据：中考 / 高考 真实高频词（已去除小学基础词）
   结构支持持续扩展到 2000+
   ============================================================ */
const WORD_DATA = {
  junior: {
    "中考核心动词": [
      {w:"achieve",ipa:"/əˈtʃiːv/",cn:"达到；完成",ex:"She finally achieved her goal of becoming a doctor.",exCn:"她最终实现了成为医生的目标。"},
      {w:"affect",ipa:"/əˈfekt/",cn:"影响",ex:"The weather can affect our mood.",exCn:"天气会影响我们的心情。"},
      {w:"appear",ipa:"/əˈpɪə(r)/",cn:"出现；似乎",ex:"A rainbow appeared after the rain.",exCn:"雨后出现了彩虹。"},
      {w:"avoid",ipa:"/əˈvɔɪd/",cn:"避免",ex:"We should avoid eating too much sugar.",exCn:"我们应该避免吃太多糖。"},
      {w:"belong",ipa:"/bɪˈlɒŋ/",cn:"属于",ex:"This book belongs to the library.",exCn:"这本书属于图书馆。"},
      {w:"breathe",ipa:"/briːð/",cn:"呼吸",ex:"It is important to breathe deeply when you feel nervous.",exCn:"紧张时深呼吸很重要。"},
      {w:"celebrate",ipa:"/ˈselɪbreɪt/",cn:"庆祝",ex:"We celebrate the Spring Festival with family.",exCn:"我们和家人一起庆祝春节。"},
      {w:"compare",ipa:"/kəmˈpeə(r)/",cn:"比较",ex:"Don't always compare yourself with others.",exCn:"不要总是把自己和别人比较。"},
      {w:"continue",ipa:"/kənˈtɪnjuː/",cn:"继续",ex:"Please continue reading the next paragraph.",exCn:"请继续读下一段。"},
      {w:"create",ipa:"/kriˈeɪt/",cn:"创造",ex:"The artist created a beautiful painting.",exCn:"这位艺术家创作了一幅美丽的画。"},
      {w:"decide",ipa:"/dɪˈsaɪd/",cn:"决定",ex:"Have you decided which club to join?",exCn:"你决定加入哪个社团了吗？"},
      {w:"describe",ipa:"/dɪˈskraɪb/",cn:"描述",ex:"Can you describe what the man looked like?",exCn:"你能描述一下那个男人长什么样吗？"},
      {w:"discover",ipa:"/dɪˈskʌvə(r)/",cn:"发现",ex:"Scientists discovered a new planet.",exCn:"科学家发现了一颗新行星。"},
      {w:"encourage",ipa:"/ɪnˈkʌrɪdʒ/",cn:"鼓励",ex:"Teachers should encourage students to ask questions.",exCn:"老师应该鼓励学生提问。"},
      {w:"explain",ipa:"/ɪkˈspleɪn/",cn:"解释",ex:"Could you explain this sentence to me?",exCn:"你能给我解释一下这个句子吗？"},
      {w:"improve",ipa:"/ɪmˈpruːv/",cn:"提高；改善",ex:"Reading every day can improve your English.",exCn:"每天阅读可以提高你的英语。"},
      {w:"include",ipa:"/ɪnˈkluːd/",cn:"包括",ex:"The price includes breakfast and dinner.",exCn:"价格包括早餐和晚餐。"},
      {w:"introduce",ipa:"/ˌɪntrəˈdjuːs/",cn:"介绍；引进",ex:"Let me introduce my friend to you.",exCn:"让我把我的朋友介绍给你。"},
      {w:"mention",ipa:"/ˈmenʃn/",cn:"提到",ex:"She didn't mention the meeting in her email.",exCn:"她在邮件里没有提到会议。"},
      {w:"prefer",ipa:"/prɪˈfɜː(r)/",cn:"更喜欢",ex:"I prefer tea to coffee.",exCn:"比起咖啡我更喜欢茶。"},
      {w:"provide",ipa:"/prəˈvaɪd/",cn:"提供",ex:"The school provides free lunch for students.",exCn:"学校为学生提供免费午餐。"},
      {w:"realize",ipa:"/ˈriːəlaɪz/",cn:"意识到；实现",ex:"I suddenly realized I had left my phone at home.",exCn:"我突然意识到我把手机落在家里了。"},
      {w:"receive",ipa:"/rɪˈsiːv/",cn:"收到",ex:"I received a letter from my pen friend.",exCn:"我收到了笔友的一封信。"},
      {w:"require",ipa:"/rɪˈkwaɪə(r)/",cn:"需要；要求",ex:"This job requires patience and hard work.",exCn:"这份工作需要耐心和努力。"},
      {w:"suggest",ipa:"/səˈdʒest/",cn:"建议",ex:"I suggest that we start earlier tomorrow.",exCn:"我建议我们明天早点开始。"}

      content:`The ocean covers more than 70 percent of the Earth’s surface. It is not just a beautiful blue place for swimming or fishing — it is essential for life on our planet. 🌊

      content:`The ocean covers more than 70 percent of our planet’s surface, yet many people still think of it mainly as a place for swimming or fishing. In reality, the ocean is one of the most powerful climate regulators on Earth. 🔬

Ocean currents, driven by wind, temperature differences and the Earth’s rotation, move huge amounts of heat around the globe. Warm water travels from the equator toward the poles, while cold water returns toward the tropics. This continuous circulation helps keep temperatures in many regions moderate and stable. Without it, some places would be much hotter and others much colder.

The ocean also absorbs a large share of the carbon dioxide that human activities release into the atmosphere. Phytoplankton — tiny plant-like organisms floating near the surface — take in carbon during photosynthesis. When they die, some of that carbon sinks to the deep ocean, where it can remain locked away for centuries. In this way, the ocean acts as a giant carbon sink that slows the pace of global warming.

However, this vital system is under growing pressure. Rising temperatures cause seawater to expand and ice sheets to melt, contributing to sea-level rise. Warmer water holds less oxygen and can harm coral reefs and other marine ecosystems. At the same time, the ocean’s ability to absorb extra carbon is not unlimited; as it takes in more CO₂, the water becomes more acidic, threatening shellfish and the food chains that depend on them.

Understanding these processes is essential if we want to mitigate climate change. Protecting marine ecosystems, reducing greenhouse-gas emissions and supporting sustainable fishing are all part of the solution. The ocean is not just a beautiful blue landscape — it is a dynamic engine that helps keep our planet livable. The more we learn about it, the clearer it becomes that caring for the ocean means caring for ourselves. 🌍`,
      translation:`海洋覆盖了地球表面超过70%的面积，但许多人仍主要把它当作游泳或钓鱼的地方。实际上，海洋是地球上最强大的气候调节器之一。🔬

由风、温度差异和地球自转驱动的洋流，在全球范围内输送着大量热量。温暖的海水从赤道流向两极，而冷水则返回热带。这种持续的循环有助于使许多地区的温度保持温和稳定。如果没有它，有些地方会热得多，另一些地方则冷得多。

海洋还吸收了人类活动释放到大气中的大量二氧化碳。浮游植物——漂浮在表层的微小植物样生物——在光合作用过程中吸收碳。当它们死亡后，部分碳会沉入深海，并可能在那里封存数百年。这样，海洋就像一个巨大的碳汇，减缓了全球变暖的速度。

然而，这个至关重要的系统正承受着越来越大的压力。气温上升导致海水膨胀、冰盖融化，从而加剧海平面上升。温暖的海水含氧量更低，并可能伤害珊瑚礁和其他海洋生态系统。同时，海洋吸收额外碳的能力并非无限；随着它吸收更多二氧化碳，海水会变得更酸，威胁贝类以及依赖它们的食物链。

如果我们想缓解气候变化，理解这些过程至关重要。保护海洋生态系统、减少温室气体排放、支持可持续捕捞，都是解决方案的一部分。海洋不仅仅是美丽的蓝色风景——它是帮助维持我们星球宜居的动力引擎。我们对它了解得越多，就越清楚：关爱海洋就是关爱我们自己。🌍`,
      questions:[

      content:`We often think of success as the result of big decisions or sudden inspiration. In truth, much of who we become is shaped by the small, repeated actions we take every day — our habits. 🔄

A habit is a behaviour that has become automatic through repetition. When you first learn to ride a bicycle or type on a keyboard, every movement requires attention. With practice, the brain creates stronger neural pathways, and the action becomes almost effortless. The same process applies to studying, exercising, reading, or even negative patterns like procrastination.

Because habits run largely on autopilot, they can work for us or against us. A student who reviews notes for twenty minutes every evening is quietly building knowledge and confidence. Another student who checks social media first thing every morning may be reinforcing distraction. Over months and years, these tiny differences compound into very different results.

Changing a habit is possible, but it usually requires more than motivation alone. Motivation comes and goes; systems and environment matter more. Making the desired behaviour easier (for example, putting a book on your pillow) and the unwanted behaviour harder (leaving the phone in another room) increases the chance of success. Tracking progress and celebrating small wins also helps reinforce the new pattern.

Perhaps the deepest power of habits lies in identity. When you repeatedly act like a reader, a runner, or a careful thinker, you begin to see yourself that way. The behaviour and the self-image support each other. In this sense, habits do not just change what we do — they gradually transform who we believe we are.

Building good habits is therefore an act of long-term self-respect. It is not about perfection, but about consistent, intentional effort. The person you will be in five years is being shaped by the habits you practise today. Choose them wisely. 🌱`,
      translation:`我们常常认为成功来自大的决定或突然的灵感。实际上，我们成为什么样的人，很大程度上是由每天重复的小行动——我们的习惯——塑造的。🔄

习惯是一种通过重复变得自动化的行为。当你第一次学骑自行车或打字时，每一个动作都需要注意力。通过练习，大脑会建立更强的神经通路，动作几乎变得不费力。同样的过程也适用于学习、锻炼、阅读，甚至像拖延这样的负面模式。

因为习惯很大程度上在“自动驾驶”状态下运行，它们既可以为我们服务，也可能与我们作对。一个每天晚上复习二十分钟笔记的学生，正在悄悄积累知识和自信。另一个每天早上第一件事就刷社交媒体的学生，可能在强化分心。几个月、几年后，这些微小的差异会累积成截然不同的结果。

改变习惯是可能的，但通常需要的不只是动机。动机来了又走；系统和环境更重要。让期望的行为更容易（比如把书放在枕头上），让不想要的行为更难（把手机放在另一个房间），会提高成功的几率。记录进度并庆祝小胜利也有助于强化新模式。

也许习惯最深层的力量在于身份认同。当你反复表现得像一个读者、跑步者或谨慎的思考者时，你开始以这种方式看待自己。行为与自我形象相互支持。从这个意义上说，习惯不仅改变我们做什么——它们逐渐转变我们认为自己是谁。

因此，培养好习惯是一种长期的自我尊重。它不关乎完美，而关乎持续、有意识的努力。五年后的你，正被你今天实践的习惯所塑造。请明智地选择它们。🌱`,
      questions:[
        {q:"1. According to the passage, what mainly shapes who we become?",options:["Only big life decisions","Sudden inspiration","The small, repeated actions we take every day — our habits","Luck and talent alone"],answer:2,exp:"much of who we become is shaped by the small, repeated actions we take every day — our habits。"},
        {q:"2. Why can habits work for us or against us?",options:["Because they are always positive","Because they run largely on autopilot and can reinforce either useful or harmful patterns","Because habits never change","Because only bad habits become automatic"],answer:1,exp:"Because habits run largely on autopilot, they can work for us or against us。"},

      content:`Social media has become a central part of daily life for many teenagers. Platforms allow us to stay connected with friends, share ideas, and learn about the world. Yet this powerful tool is a double-edged sword. 📱

On the positive side, social media can open doors. Students can join study groups, follow educational accounts, and discover new interests. During difficult times, online communities often provide emotional support. It can also give young people a voice on social issues that matter to them.

However, the risks are real. Endless scrolling can waste time that could be spent on study, exercise or real-life conversation. Constant comparison with carefully edited lives online may increase anxiety and lower self-esteem. Privacy is another concern — personal information shared today may be hard to remove later. In some cases, social media use can even develop into a form of addiction.

The key is not to reject social media completely, but to use it with awareness and balance. Setting time limits, turning off unnecessary notifications, and choosing content that truly adds value can help. It is also important to remember that what we see online is often only a small, polished part of reality.

Critical thinking is essential. Before believing or sharing information, we should ask: Is this reliable? Who benefits from this message? Developing these habits early will serve us well in an increasingly digital world.

Social media itself is neither purely good nor purely bad. How we choose to use it determines whether it becomes a helpful tool or a source of distraction. The power is in our hands. 🌱`,
      translation:`社交媒体已成为许多青少年日常生活的核心部分。平台让我们与朋友保持联系、分享想法并了解世界。然而，这个强大的工具是一把双刃剑。📱

从积极的一面看，社交媒体可以打开大门。学生可以加入学习小组、关注教育账号并发现新兴趣。在困难时期，在线社区常常提供情感支持。它也可以让年轻人在关心的社会问题上发出自己的声音。

然而，风险是真实存在的。无休止的刷屏会浪费本可用于学习、锻炼或真实对话的时间。与网上精心编辑的生活不断比较，可能增加焦虑并降低自尊。隐私是另一个问题——今天分享的个人信息以后可能很难删除。在某些情况下，社交媒体使用甚至可能发展成一种上瘾。

关键不是完全拒绝社交媒体，而是有意识和平衡地使用它。设定时间限制、关闭不必要的通知，并选择真正有价值的内容会有帮助。还要记住，我们在网上看到的往往只是现实中一小部分被美化的部分。

/* ===== 状态与核心逻辑 ===== */
let currentLevel = "junior";
let currentMode = "words";
let currentCat = null;
let currentArtCat = "全部";
let currentArticle = null;
let userAnswers = {};

function setLevel(level, btn) {
  currentLevel = level;
  document.querySelectorAll(".level-btn").forEach(b => {
    b.classList.remove("active", "senior");
    if (b.dataset.level === level) {
      b.classList.add("active");
      if (level === "senior") b.classList.add("senior");
    }
  });
  currentCat = null;
  currentArtCat = "全部";
  if (currentMode === "words") renderWords();
  else renderArtList();
}

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  document.getElementById("wordsPanel").style.display = mode === "words" ? "block" : "none";
  document.getElementById("readingPanel").style.display = mode === "reading" ? "block" : "none";
  if (mode === "words") renderWords();
  else {
    document.getElementById("listView").style.display = "block";
    document.getElementById("detailView").classList.remove("active");
    renderArtList();
  }
}

function speak(text, rate = 0.95) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = rate;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}
function speakPopup(rate) {
  speak(document.getElementById("pWord").innerText, rate);
}

/* ===== 单词渲染 ===== */
function renderWords() {
  const data = WORD_DATA[currentLevel];
  const cats = Object.keys(data);
  if (!currentCat || !cats.includes(currentCat)) currentCat = cats[0];
  document.getElementById("catPills").innerHTML = cats.map(c =>
    `<button class="pill ${c === currentCat ? "active" : ""}" onclick="selectCat('${c}')">${c}</button>`
  ).join("");
  filterWords();
}
function selectCat(cat) {
  currentCat = cat;
  renderWords();
}
function filterWords() {
  const q = (document.getElementById("wordSearch").value || "").trim().toLowerCase();
  const data = WORD_DATA[currentLevel];
  let list = currentCat && data[currentCat] ? data[currentCat] : [];
  if (!currentCat) Object.values(data).forEach(arr => list = list.concat(arr));
  if (q) list = list.filter(item => item.w.toLowerCase().includes(q) || item.cn.includes(q) || (item.ex && item.ex.toLowerCase().includes(q)));
  const total = Object.values(data).reduce((s, a) => s + a.length, 0);
  document.getElementById("wordStats").innerHTML =
    `<span>当前：${currentLevel === "junior" ? "中考" : "高考"} · ${currentCat} · 本类 ${list.length} 词</span>
     <span style="color:#5eead4">词库总量约 ${total} 词（持续扩充中）</span>`;
  const grid = document.getElementById("wordGrid");
  if (!list.length) {
    grid.innerHTML = `<div class="empty">没有找到匹配的单词，试试其他关键词吧～</div>`;
    return;
  }
  grid.innerHTML = list.map(item => `
    <div class="word-card">
      <div class="w-main">${item.w}</div>
      <div class="w-ipa">${item.ipa}</div>
      <div class="w-cn">${item.cn}</div>
      <div class="w-ex" onclick="speak('${item.ex.replace(/'/g, "\\'")}', 0.9)" title="点击朗读例句">
        <div class="en">${item.ex}</div>
        <div class="cn">${item.exCn}</div>
        <div class="hint">🔊 点击例句可朗读</div>
      </div>
      <div class="w-actions">
        <button class="btn btn-play" onclick="speak('${item.w}', 0.95)">🔊 常速</button>
        <button class="btn btn-slow" onclick="speak('${item.w}', 0.58)">🐢 慢速</button>
      </div>
    </div>
  `).join("");
}

/* ===== 阅读渲染 ===== */
function renderArtList() {
  const list = ARTICLE_DATA[currentLevel] || [];
  const cats = ["全部", ...new Set(list.map(a => a.cat))];
  document.getElementById("artCatPills").innerHTML = cats.map(c =>
    `<button class="pill ${c === currentArtCat ? "active" : ""}" onclick="selectArtCat('${c}')">${c}</button>`
  ).join("");
  const filtered = currentArtCat === "全部" ? list : list.filter(a => a.cat === currentArtCat);
  document.getElementById("artStats").innerText =
    `${currentLevel === "junior" ? "中考" : "高考"}阶段 · ${currentArtCat} · 共 ${filtered.length} 篇（每篇≥300词，分类持续扩充）`;
  const box = document.getElementById("artList");
  if (!filtered.length) {
    box.innerHTML = `<div class="empty">该分类暂无短文，请切换分类或级别～</div>`;
    return;
  }
  box.innerHTML = filtered.map(a => `
    <div class="art-card" onclick="openArticle('${a.id}')">
      <div class="t">${a.title}</div>
      <div class="meta">
        <span class="tag words">${a.words} 词</span>
        <span class="tag">${a.cat}</span>
        ${a.tags.map(t => `<span class="tag">${t}</span>`).join("")}
      </div>
    </div>
  `).join("");
}
function selectArtCat(cat) {
  currentArtCat = cat;
  renderArtList();
}
function openArticle(id) {
  const list = ARTICLE_DATA[currentLevel] || [];
  currentArticle = list.find(a => a.id === id);
  if (!currentArticle) return;
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").classList.add("active");
  document.getElementById("artTitle").innerText = currentArticle.title;
  let html = currentArticle.content;
  const hard = currentArticle.hardWords || {};
  Object.keys(hard).sort((a, b) => b.length - a.length).forEach(w => {
    const re = new RegExp(`\\b(${w})\\b`, "gi");
    html = html.replace(re, (m) => {
      const info = hard[w];
      return `<span class="hard" data-word="${w}" data-ipa="${info.ipa}" data-cn="${info.cn}" onclick="showPopup(this)">${m}</span>`;
    });
  });
  document.getElementById("artBody").innerHTML = html;
  document.getElementById("artTrans").innerText = currentArticle.translation;
  userAnswers = {};
  document.getElementById("qBox").innerHTML = currentArticle.questions.map((q, qi) => `
    <div class="q-card" id="qcard-${qi}">
      <div class="q-text">${q.q}</div>
      ${q.options.map((opt, oi) => `
        <label class="q-opt" id="opt-${qi}-${oi}">
          <input type="radio" name="q${qi}" value="${oi}" onchange="userAnswers[${qi}]=${oi}">
          <span>${opt}</span>
        </label>
      `).join("")}
    </div>
  `).join("");
  document.getElementById("scoreBanner").style.display = "none";
}
function backToList() {
  document.getElementById("detailView").classList.remove("active");
  document.getElementById("listView").style.display = "block";
  currentArticle = null;
}
function showPopup(el) {
  document.getElementById("pWord").innerText = el.dataset.word;
  document.getElementById("pIpa").innerText = el.dataset.ipa;
  document.getElementById("pCn").innerText = el.dataset.cn;
  document.getElementById("popup").classList.add("show");
}
function closePopup() {
  document.getElementById("popup").classList.remove("show");
}
function checkAnswers() {
  if (!currentArticle) return;
  const qs = currentArticle.questions;
  let correct = 0;
  qs.forEach((q, qi) => {
    const selected = userAnswers[qi];
    q.options.forEach((_, oi) => {
      const el = document.getElementById(`opt-${qi}-${oi}`);
      el.classList.remove("selected", "correct", "wrong");
      if (oi === q.answer) el.classList.add("correct");
      if (selected === oi && oi !== q.answer) el.classList.add("wrong");
      if (selected === oi) el.classList.add("selected");
    });
    if (selected === q.answer) correct++;
  });
  const total = qs.length;
  const pct = Math.round(correct / total * 100);
  const banner = document.getElementById("scoreBanner");
  banner.style.display = "block";
  banner.innerHTML = `得分：${correct} / ${total}（${pct}分）<br><small style="font-weight:600;color:#a7f3d0;">绿色为正确答案 · 红色为错选 · 可重读后再试</small>`;
  qs.forEach((q, qi) => {
    if (userAnswers[qi] !== q.answer) {
      const card = document.getElementById(`qcard-${qi}`);
      if (card && !card.querySelector(".exp")) {
        const exp = document.createElement("div");
        exp.className = "exp";
        exp.style.cssText = "margin-top:8px;font-size:0.8rem;color:#fbbf24;line-height:1.4;";
        exp.innerText = "💡 " + q.exp;
        card.appendChild(exp);
      }
    }
  });
}

renderWords();
