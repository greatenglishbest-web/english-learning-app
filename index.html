<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语单词与阅读理解学习神器 · 远程数据版</title>
<style>
:root{--bg:#0b1220;--card:#131c31;--elev:#1c2740;--bd:rgba(148,180,220,.18);--tx:#f0f6ff;--sec:#94a8c4;--acc:#5eead4;--play:#38bdf8;--slow:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 10% 0%,#1e3a5f 0%,transparent 45%),radial-gradient(ellipse at 90% 10%,#3b1f5e 0%,transparent 40%),var(--bg);color:var(--tx);font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;min-height:100vh;padding:10px;display:flex;justify-content:center;line-height:1.5}
.app{width:100%;max-width:1120px;display:flex;flex-direction:column;gap:12px}
.header{background:linear-gradient(135deg,rgba(28,39,64,.95),rgba(19,28,49,.92));border:1px solid var(--bd);border-radius:22px;padding:14px 18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.title h1{font-size:1.28rem;font-weight:900;background:linear-gradient(90deg,#5eead4,#7dd3fc,#c084fc,#f9a8d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.title p{font-size:.74rem;color:var(--sec);margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.switch{display:flex;background:var(--bg);border-radius:14px;border:1px solid var(--bd);overflow:hidden;padding:3px}
.switch button{border:none;background:transparent;color:var(--sec);padding:7px 14px;font-size:.8rem;font-weight:800;cursor:pointer;border-radius:11px}
.switch button.active{color:#fff}
.level-btn.active{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.level-btn.active.senior{background:linear-gradient(135deg,#a855f7,#ec4899)}
.mode-btn.active{background:linear-gradient(135deg,#14b8a6,#0ea5e9)}
.main{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;min-height:540px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.search{flex:1;min-width:150px;background:var(--elev);border:1px solid var(--bd);border-radius:14px;padding:9px 14px;color:#fff;font-size:.86rem;outline:none}
.search:focus{border-color:#5eead4}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid rgba(148,180,220,.22);background:var(--elev);color:#b8c9e0;padding:5px 12px;border-radius:999px;font-size:.74rem;font-weight:800;cursor:pointer}
.pill.active,.pill:hover{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);border-color:transparent;color:#fff}
.stats{font-size:.76rem;color:var(--sec);margin-bottom:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:11px;max-height:620px;overflow-y:auto}
.word-card{background:linear-gradient(160deg,var(--elev),#1a2438);border:1px solid rgba(148,180,220,.15);border-radius:16px;padding:13px 14px;transition:.2s}
.word-card:hover{border-color:rgba(94,234,212,.4);transform:translateY(-2px)}
.w-main{font-size:1.28rem;font-weight:900}
.w-ipa{font-size:.9rem;color:#5eead4;font-weight:700;margin-top:2px}
.w-cn{font-size:.84rem;margin:5px 0 8px;font-weight:600}
.w-ex{font-size:.78rem;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.15);border-radius:11px;padding:8px 10px;margin-bottom:9px;cursor:pointer;line-height:1.5}
.w-ex:hover{background:rgba(56,189,248,.16)}
.w-ex .cn{color:#7c8da6;margin-top:3px;font-size:.74rem}
.w-ex .hint{font-size:.68rem;color:#5eead4;margin-top:4px}
.w-actions{display:flex;gap:7px}
.btn{border:none;border-radius:10px;padding:7px 0;font-size:.76rem;font-weight:800;color:#fff;cursor:pointer;flex:1}
.btn-play{background:linear-gradient(135deg,#0ea5e9,#0284c7)}
.btn-slow{background:linear-gradient(135deg,#f59e0b,#d97706)}
.art-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.art-card{background:linear-gradient(160deg,var(--elev),#1a2438);border:1px solid rgba(148,180,220,.15);border-radius:16px;padding:14px 15px;cursor:pointer;transition:.2s}
.art-card:hover{border-color:#5eead4;transform:translateY(-3px)}
.art-card .t{font-size:.96rem;font-weight:800;margin-bottom:7px;line-height:1.35}
.art-card .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.7rem}
.tag{background:rgba(167,139,250,.18);color:#c4b5fd;padding:2px 8px;border-radius:8px;font-weight:700}
.tag.words{background:rgba(56,189,248,.15);color:#7dd3fc}
.back{border:1px solid rgba(148,180,220,.3);background:transparent;color:#5eead4;padding:7px 14px;border-radius:12px;font-size:.8rem;font-weight:800;cursor:pointer;margin-bottom:12px}
.art-title{font-size:1.35rem;font-weight:900;margin-bottom:12px;background:linear-gradient(90deg,#5eead4,#7dd3fc,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.3}
.art-body{font-size:.96rem;line-height:1.8;color:#e2e8f0;background:var(--elev);border-radius:16px;padding:16px 18px;margin-bottom:14px;white-space:pre-wrap;border:1px solid rgba(148,180,220,.1)}
.hard{color:#fbbf24;font-weight:800;border-bottom:2.5px solid rgba(251,191,36,.5);cursor:pointer;padding:0 2px;border-radius:4px}
.hard:hover{background:rgba(251,191,36,.2)}
.trans-box{background:linear-gradient(135deg,rgba(52,211,153,.08),rgba(16,185,129,.05));border:1px solid rgba(52,211,153,.25);border-radius:14px;padding:13px 15px;margin-bottom:16px;font-size:.87rem;color:#a7f3d0;line-height:1.7}
.trans-box h4{color:#34d399;font-size:.84rem;margin-bottom:6px;font-weight:800}
.q-sec h3{font-size:1.08rem;margin-bottom:12px;font-weight:800}
.q-card{background:var(--elev);border:1px solid rgba(148,180,220,.14);border-radius:14px;padding:13px 14px;margin-bottom:11px}
.q-text{font-size:.91rem;font-weight:800;margin-bottom:10px}
.q-opt{display:flex;align-items:flex-start;gap:9px;padding:8px 11px;border-radius:11px;cursor:pointer;margin-bottom:4px;font-size:.85rem;border:1px solid transparent}
.q-opt:hover{background:rgba(56,189,248,.1)}
.q-opt.selected{background:rgba(14,165,233,.18);border-color:#38bdf8}
.q-opt.correct{background:rgba(52,211,153,.18);border-color:#34d399}
.q-opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}
.check-btn{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);border:none;color:#fff;padding:11px 22px;border-radius:14px;font-size:.92rem;font-weight:900;cursor:pointer;margin-top:8px}
.score-banner{display:none;background:linear-gradient(135deg,rgba(52,211,153,.15),rgba(16,185,129,.08));border:1px solid rgba(52,211,153,.35);border-radius:14px;padding:13px;margin-top:12px;text-align:center;font-size:1.08rem;font-weight:900;color:#6ee7b7}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
.mask.show{display:flex}
.popup{background:linear-gradient(160deg,#1e293b,#0f172a);border:1px solid rgba(94,234,212,.35);border-radius:20px;padding:20px 22px;max-width:340px;width:90%;text-align:center}
.p-word{font-size:1.5rem;font-weight:900}
.p-ipa{font-size:1.1rem;color:#5eead4;margin:7px 0;font-weight:700}
.p-cn{font-size:1.05rem;margin-bottom:14px;font-weight:600}
.p-btns{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.p-btns button{border:none;border-radius:11px;padding:9px 16px;font-size:.82rem;font-weight:800;color:#fff;cursor:pointer}
.p-close{background:#475569;width:100%;padding:9px;border:none;border-radius:11px;color:#fff;font-weight:800;cursor:pointer;margin-top:4px}
.empty{text-align:center;color:var(--sec);padding:50px 20px;font-size:.92rem}
.view{display:none}.view.active{display:block}
.loading{text-align:center;padding:60px 20px;color:#5eead4;font-size:1rem;font-weight:700}
.status-bar{font-size:.72rem;color:#64748b;text-align:right;margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">
      <h1>🚀 英语单词与阅读理解学习神器</h1>
      <p>中高考高频词汇 · 远程数据加载 · 护眼卡通科技风</p>
    </div>
    <div class="controls">
      <div class="switch">
        <button class="level-btn active" data-level="junior" onclick="setLevel('junior',this)">初中·中考</button>
        <button class="level-btn" data-level="senior" onclick="setLevel('senior',this)">高中·高考</button>
      </div>
      <div class="switch">
        <button class="mode-btn active" data-mode="words" onclick="setMode('words',this)">单词</button>
        <button class="mode-btn" data-mode="reading" onclick="setMode('reading',this)">阅读</button>
      </div>
    </div>
  </div>
  <div class="main">
    <div id="loadingBox" class="loading">正在从云端加载数据，请稍候…</div>
    <div id="wordsPanel" style="display:none">
      <div class="toolbar">
        <input class="search" id="wordSearch" placeholder="🔍 搜索单词 / 中文释义..." oninput="filterWords()">
        <div class="pills" id="catPills"></div>
      </div>
      <div class="stats" id="wordStats"></div>
      <div class="word-grid" id="wordGrid"></div>
    </div>
    <div id="readingPanel" style="display:none">
      <div id="listView">
        <div class="toolbar"><div class="pills" id="artCatPills"></div></div>
        <div class="stats" id="artStats"></div>
        <div class="art-list" id="artList"></div>
      </div>
      <div id="detailView" class="view">
        <button class="back" onclick="backToList()">← 返回文章列表</button>
        <div class="art-title" id="artTitle"></div>
        <div class="art-body" id="artBody"></div>
        <div class="trans-box"><h4>📖 中文翻译</h4><div id="artTrans"></div></div>
        <div class="q-sec">
          <h3>✏️ 阅读理解</h3>
          <div id="qBox"></div>
          <button class="check-btn" onclick="checkAnswers()">提交答案并查看解析</button>
          <div class="score-banner" id="scoreBanner"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="status-bar" id="statusBar">数据来源：加载中…</div>
</div>
<div class="mask" id="popup">
  <div class="popup">
    <div class="p-word" id="pWord"></div>
    <div class="p-ipa" id="pIpa"></div>
    <div class="p-cn" id="pCn"></div>
    <div class="p-btns">
      <button class="btn-play" onclick="speakPopup(0.95)">🔊 常速</button>
      <button class="btn-slow" onclick="speakPopup(0.58)">🐢 慢速</button>
    </div>
    <button class="p-close" onclick="closePopup()">关闭</button>
  </div>
</div>
<script>
const DATA_BASE='https://greatenglishbest-web.github.io/english-learning-app/data';
const WORDS_URL=DATA_BASE+'/words.json';
const ARTICLES_URL=DATA_BASE+'/articles.json';
let WORD_DATA={},ARTICLE_DATA={},dataReady=false;
let currentLevel='junior',currentMode='words',currentCat=null,currentArtCat='全部',currentArticle=null,userAnswers={};

async function loadData(){
  const status=document.getElementById('statusBar');
  try{
    const [wRes,aRes]=await Promise.all([fetch(WORDS_URL+'?t='+Date.now()),fetch(ARTICLES_URL+'?t='+Date.now())]);
    if(!wRes.ok||!aRes.ok) throw new Error('HTTP '+wRes.status);
    WORD_DATA=await wRes.json();
    ARTICLE_DATA=await aRes.json();
    dataReady=true;
    status.innerText='数据来源：GitHub 云端（已成功加载）';
    document.getElementById('loadingBox').style.display='none';
    document.getElementById('wordsPanel').style.display='block';
    renderWords();
  }catch(e){
    console.error(e);
    status.innerText='云端加载失败，请检查网络或确认 JSON 文件已上传。';
    document.getElementById('loadingBox').innerHTML='云端数据加载失败<br><small style="color:#94a3b8">请确认 data/words.json 和 data/articles.json 已正确上传到 GitHub</small>';
    WORD_DATA={junior:{},senior:{}};
    ARTICLE_DATA={junior:[],senior:[]};
    dataReady=true;
  }
}

function setLevel(level,btn){
  currentLevel=level;
  document.querySelectorAll('.level-btn').forEach(b=>{b.classList.remove('active','senior');if(b.dataset.level===level){b.classList.add('active');if(level==='senior')b.classList.add('senior');}});
  currentCat=null;currentArtCat='全部';
  if(currentMode==='words')renderWords();else renderArtList();
}
function setMode(mode,btn){
  currentMode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  document.getElementById('wordsPanel').style.display=mode==='words'?'block':'none';
  document.getElementById('readingPanel').style.display=mode==='reading'?'block':'none';
  if(mode==='words')renderWords();
  else{document.getElementById('listView').style.display='block';document.getElementById('detailView').classList.remove('active');renderArtList();}
}
function speak(text,rate=0.95){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1.05;
  window.speechSynthesis.speak(u);
}
function speakPopup(rate){speak(document.getElementById('pWord').innerText,rate);}

function renderWords(){
  if(!dataReady)return;
  const data=WORD_DATA[currentLevel]||{};
  const cats=Object.keys(data);
  if(!cats.length){
    document.getElementById('wordGrid').innerHTML='<div class="empty">暂无单词数据</div>';
    document.getElementById('wordStats').innerText='当前无数据';
    document.getElementById('catPills').innerHTML='';
    return;
  }
  if(!currentCat||!cats.includes(currentCat))currentCat=cats[0];
  document.getElementById('catPills').innerHTML=cats.map(c=>`<button class="pill ${c===currentCat?'active':''}" onclick="selectCat('${c}')">${c}</button>`).join('');
  filterWords();
}
function selectCat(cat){currentCat=cat;renderWords();}
function filterWords(){
  const q=(document.getElementById('wordSearch').value||'').trim().toLowerCase();
  const data=WORD_DATA[currentLevel]||{};
  let list=currentCat&&data[currentCat]?data[currentCat]:[];
  if(q)list=list.filter(item=>item.w.toLowerCase().includes(q)||(item.cn&&item.cn.includes(q))||(item.ex&&item.ex.toLowerCase().includes(q)));
  const total=Object.values(data).reduce((s,a)=>s+(a?a.length:0),0);
  document.getElementById('wordStats').innerHTML=`<span>当前：${currentLevel==='junior'?'中考':'高考'} · ${currentCat||''} · 本类 ${list.length} 词</span><span style="color:#5eead4">词库总量 ${total} 词</span>`;
  const grid=document.getElementById('wordGrid');
  if(!list.length){grid.innerHTML='<div class="empty">没有找到匹配的单词</div>';return;}
  grid.innerHTML=list.map(item=>`
    <div class="word-card">
      <div class="w-main">${item.w}</div>
      <div class="w-ipa">${item.ipa||''}</div>
      <div class="w-cn">${item.cn||''}</div>
      <div class="w-ex" onclick="speak('${(item.ex||'').replace(/'/g,"\\'")}',0.9)">
        <div class="en">${item.ex||''}</div>
        <div class="cn">${item.exCn||''}</div>
        <div class="hint">🔊 点击例句可朗读</div>
      </div>
      <div class="w-actions">
        <button class="btn btn-play" onclick="speak('${item.w}',0.95)">🔊 常速</button>
        <button class="btn btn-slow" onclick="speak('${item.w}',0.58)">🐢 慢速</button>
      </div>
    </div>`).join('');
}

function renderArtList(){
  if(!dataReady)return;
  const list=ARTICLE_DATA[currentLevel]||[];
  const cats=['全部',...new Set(list.map(a=>a.cat).filter(Boolean))];
  document.getElementById('artCatPills').innerHTML=cats.map(c=>`<button class="pill ${c===currentArtCat?'active':''}" onclick="selectArtCat('${c}')">${c}</button>`).join('');
  const filtered=currentArtCat==='全部'?list:list.filter(a=>a.cat===currentArtCat);
  document.getElementById('artStats').innerText=`${currentLevel==='junior'?'中考':'高考'}阶段 · ${currentArtCat} · 共 ${filtered.length} 篇`;
  const box=document.getElementById('artList');
  if(!filtered.length){box.innerHTML='<div class="empty">该分类暂无短文</div>';return;}
  box.innerHTML=filtered.map(a=>`
    <div class="art-card" onclick="openArticle('${a.id}')">
      <div class="t">${a.title}</div>
      <div class="meta">
        <span class="tag words">${a.words||300} 词</span>
        <span class="tag">${a.cat||''}</span>
        ${(a.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
      </div>
    </div>`).join('');
}
function selectArtCat(cat){currentArtCat=cat;renderArtList();}
function openArticle(id){
  const list=ARTICLE_DATA[currentLevel]||[];
  currentArticle=list.find(a=>a.id===id);
  if(!currentArticle)return;
  document.getElementById('listView').style.display='none';
  document.getElementById('detailView').classList.add('active');
  document.getElementById('artTitle').innerText=currentArticle.title;
  let html=currentArticle.content||'';
  const hard=currentArticle.hardWords||{};
  Object.keys(hard).sort((a,b)=>b.length-a.length).forEach(w=>{
    const re=new RegExp('\\b('+w+')\\b','gi');
    html=html.replace(re,m=>{
      const info=hard[w];
      return `<span class="hard" data-word="${w}" data-ipa="${info.ipa||''}" data-cn="${info.cn||''}" onclick="showPopup(this)">${m}</span>`;
    });
  });
  document.getElementById('artBody').innerHTML=html;
  document.getElementById('artTrans').innerText=currentArticle.translation||'';
  userAnswers={};
  const qs=currentArticle.questions||[];
  document.getElementById('qBox').innerHTML=qs.map((q,qi)=>`
    <div class="q-card" id="qcard-${qi}">
      <div class="q-text">${q.q}</div>
      ${(q.options||[]).map((opt,oi)=>`
        <label class="q-opt" id="opt-${qi}-${oi}">
          <input type="radio" name="q${qi}" value="${oi}" onchange="userAnswers[${qi}]=${oi}">
          <span>${opt}</span>
        </label>`).join('')}
    </div>`).join('');
  document.getElementById('scoreBanner').style.display='none';
}
function backToList(){
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('listView').style.display='block';
  currentArticle=null;
}
function showPopup(el){
  document.getElementById('pWord').innerText=el.dataset.word;
  document.getElementById('pIpa').innerText=el.dataset.ipa;
  document.getElementById('pCn').innerText=el.dataset.cn;
  document.getElementById('popup').classList.add('show');
}
function closePopup(){document.getElementById('popup').classList.remove('show');}
function checkAnswers(){
  if(!currentArticle)return;
  const qs=currentArticle.questions||[];
  let correct=0;
  qs.forEach((q,qi)=>{
    const selected=userAnswers[qi];
    (q.options||[]).forEach((_,oi)=>{
      const el=document.getElementById(`opt-${qi}-${oi}`);
      if(!el)return;
      el.classList.remove('selected','correct','wrong');
      if(oi===q.answer)el.classList.add('correct');
      if(selected===oi&&oi!==q.answer)el.classList.add('wrong');
      if(selected===oi)el.classList.add('selected');
    });
    if(selected===q.answer)correct++;
  });
  const total=qs.length,pct=total?Math.round(correct/total*100):0;
  const banner=document.getElementById('scoreBanner');
  banner.style.display='block';
  banner.innerHTML=`得分：${correct} / ${total}（${pct}分）<br><small style="font-weight:600;color:#a7f3d0">绿色为正确答案 · 红色为错选</small>`;
  qs.forEach((q,qi)=>{
    if(userAnswers[qi]!==q.answer&&q.exp){
      const card=document.getElementById(`qcard-${qi}`);
      if(card&&!card.querySelector('.exp')){
        const exp=document.createElement('div');
        exp.className='exp';
        exp.style.cssText='margin-top:8px;font-size:0.8rem;color:#fbbf24;line-height:1.4;';
        exp.innerText='💡 '+q.exp;
        card.appendChild(exp);
      }
    }
  });
}
loadData();
</script>
</body>
</html>
