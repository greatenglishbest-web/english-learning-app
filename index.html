function licHmacSha256Sync(keyStr,msgStr){
  var key=licUtf8(keyStr),msg=licUtf8(msgStr);

function licHmacSha256(keyStr,msgStr){
  var subtle=typeof crypto!=='undefined'&&crypto.subtle;
  if(subtle){
    return crypto.subtle.importKey('raw',licUtf8(keyStr),{name:'HMAC',hash:'SHA-256'},false,['sign'])
      .then(function(key){return crypto.subtle.sign('HMAC',key,licUtf8(msgStr));})
      .then(function(sig){return new Uint8Array(sig);})
      .catch(function(){return licHmacSha256Sync(keyStr,msgStr);});
  }
  return Promise.resolve(licHmacSha256Sync(keyStr,msgStr));
}
function licNorm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}

  group=group||4;

  for(var i=0;i<s.length;i+=group) out.push(s.slice(i,i+group));

function licBytesToCode(bytes,len){
  var chars=[],buf=0,bits=0,i;
  for(i=0;i<bytes.length&&chars.length<len;i++){
    buf=(buf<<8)|bytes[i];
    bits+=8;
    while(bits>=5&&chars.length<len){
      bits-=5;
      chars.push(LIC_ABC[(buf>>bits)&31]);

}
function licMakeCodeSync(deviceCode,planId){
  var msg=licNorm(deviceCode)+'|'+planId;
  var dig=licHmacSha256Sync(_lk(),msg);
  return licFmt(licBytesToCode(dig,12),4);
}
function licMakeCode(deviceCode,planId){
  var msg=licNorm(deviceCode)+'|'+planId;
  return licHmacSha256(_lk(),msg).then(function(dig){return licFmt(licBytesToCode(dig,12),4);});

function licMatchPlan(deviceCode,actCode){
  var want=licNorm(actCode),ids=Object.keys(LIC_PLANS),i;
  for(i=0;i<ids.length;i++){
    if(licNorm(licMakeCodeSync(deviceCode,ids[i]))===want) return ids[i];
  }
  return null;
}

var LIC_KEY='eea_lic_v1';
var LIC_TRIAL_MS=48*3600*1000;
var LIC_SKEW_MS=2*3600*1000;
var LIC_WX='lmgsjgzt';
var _licState=null;
var _licModalOpen=false;
var _licBlocking=false;
var _licTimer=null;

function licNow(){return Date.now();}
function licParse(raw){
  if(!raw) return null;
  try{if(typeof raw==='string') raw=JSON.parse(raw);}catch(e){return null;}
  if(!raw||typeof raw!=='object') return null;
  var c=licNorm(raw.c);
  if(!c||c.length!==8) return null;
  var t0=Number(raw.t0);
  if(!isFinite(t0)||t0<=0) return null;
  var st={c:c,t0:t0,ls:Number(raw.ls)||t0,tp:raw.tp?1:0,a:null};
  if(raw.a&&LIC_PLANS[raw.a.p]){
    st.a={p:raw.a.p,t:Number(raw.a.t)||t0,e:Number(raw.a.e)||0};
  }
  return st;
}
function licMerge(list){
  var i,s,best=null,e1,e2;
  for(i=0;i<list.length;i++){
    s=licParse(list[i]);
    if(!s) continue;
    if(!best){best={c:s.c,t0:s.t0,ls:s.ls,tp:s.tp,a:s.a?{p:s.a.p,t:s.a.t,e:s.a.e}:null};continue;}
    if(s.t0<best.t0){best.c=s.c;best.t0=s.t0;}
    if((s.ls||0)>(best.ls||0)) best.ls=s.ls;
    if(s.tp) best.tp=1;
    if(s.a){
      if(!best.a) best.a={p:s.a.p,t:s.a.t,e:s.a.e};
      else{
        e1=best.a.e===0?Infinity:best.a.e;
        e2=s.a.e===0?Infinity:s.a.e;
        if(e2>e1) best.a={p:s.a.p,t:s.a.t,e:s.a.e};
      }
    }
  }
  return best;
}
function licReadLS(){
  try{return licParse(localStorage.getItem(LIC_KEY));}catch(e){return null;}
}
function licWriteLS(st){
  try{localStorage.setItem(LIC_KEY,JSON.stringify(st));}catch(e){}
}
function licReadCookie(){
  try{
    var parts=document.cookie.split(';'),i,p;
    for(i=0;i<parts.length;i++){
      p=parts[i].replace(/^\s+/,'').replace(/\s+$/,'');
      if(p.indexOf(LIC_KEY+'=')===0) return licParse(decodeURIComponent(p.slice(LIC_KEY.length+1)));
    }
  }catch(e){}
  return null;
}
function licWriteCookie(st){
  try{document.cookie=LIC_KEY+'='+encodeURIComponent(JSON.stringify(st))+';path=/;max-age=315360000;SameSite=Lax';}catch(e){}
}
function licIdbOpen(){
  return new Promise(function(resolve){
    try{
      if(typeof indexedDB==='undefined'){resolve(null);return;}
      var req=indexedDB.open(LIC_KEY,1);
      req.onerror=function(){resolve(null);};
      req.onupgradeneeded=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onsuccess=function(e){resolve(e.target.result);};
    }catch(e){resolve(null);}
  });
}
function licReadIDB(){
  return new Promise(function(resolve){
    var done=false;
    var to=setTimeout(function(){if(!done){done=true;resolve(null);}},1200);
    licIdbOpen().then(function(db){
      if(done){if(db) try{db.close();}catch(e){} return;}
      if(!db){done=true;clearTimeout(to);resolve(null);return;}
      try{
        var tx=db.transaction('kv','readonly');
        var g=tx.objectStore('kv').get('state');
        g.onsuccess=function(){if(!done){done=true;clearTimeout(to);db.close();resolve(licParse(g.result));}};
        g.onerror=function(){if(!done){done=true;clearTimeout(to);try{db.close();}catch(e){}resolve(null);}};
      }catch(e){if(!done){done=true;clearTimeout(to);try{db.close();}catch(err){}resolve(null);}}
    });
  });
}
function licWriteIDB(st){
  return new Promise(function(resolve){
    var done=false;
    var to=setTimeout(function(){if(!done){done=true;resolve();}},1200);
    licIdbOpen().then(function(db){
      if(done){if(db) try{db.close();}catch(e){} return;}
      if(!db){done=true;clearTimeout(to);resolve();return;}
      try{
        var tx=db.transaction('kv','readwrite');
        tx.objectStore('kv').put(st,'state');
        tx.oncomplete=function(){if(!done){done=true;clearTimeout(to);db.close();resolve();}};
        tx.onerror=function(){if(!done){done=true;clearTimeout(to);try{db.close();}catch(e){}resolve();}};
      }catch(e){if(!done){done=true;clearTimeout(to);try{db.close();}catch(err){}resolve();}}
    });
  });
}
function licPersist(st){
  licWriteLS(st);
  licWriteCookie(st);
  return licWriteIDB(st);
}
function licRandCode(len){
  var out='',i,arr=new Uint8Array(len);
  if(typeof crypto!=='undefined'&&crypto.getRandomValues) crypto.getRandomValues(arr);
  else for(i=0;i<len;i++) arr[i]=Math.floor(Math.random()*256);
  for(i=0;i<len;i++) out+=LIC_ABC[arr[i]%32];
  return out;
}
function licNewState(){
  var t=licNow();
  return {c:licRandCode(8),t0:t,ls:t,tp:0,a:null};
}
function licStatus(st,now){
  now=now==null?licNow():now;
  if(!st) return {ok:false,reason:'trial',remain:0,until:0,plan:null};
  if(st.ls&&now<st.ls-LIC_SKEW_MS) st.tp=1;
  if(st.tp){
    return {ok:false,reason:st.a?'member':'trial',remain:0,until:0,plan:st.a?st.a.p:null,tamper:true};
  }
  if(st.a){
    if(st.a.e===0) return {ok:true,reason:'life',remain:Infinity,until:0,plan:'life'};
    if(now<st.a.e) return {ok:true,reason:'paid',remain:st.a.e-now,until:st.a.e,plan:st.a.p};
    return {ok:false,reason:'member',remain:0,until:st.a.e,plan:st.a.p};
  }
  var end=st.t0+LIC_TRIAL_MS;
  if(now<end) return {ok:true,reason:'trial',remain:end-now,until:end,plan:null};
  return {ok:false,reason:'trial',remain:0,until:end,plan:null};
}
function licFmtDate(ts){
  var d=new Date(ts);
  var m=String(d.getMonth()+1),day=String(d.getDate());
  if(m.length<2)m='0'+m;
  if(day.length<2)day='0'+day;
  return d.getFullYear()+'-'+m+'-'+day;
}
function licRemainText(ms){
  var h=Math.floor(ms/3600000);
  if(ms>47*3600000) h=48;
  if(h>=1) return '免费试用剩余 '+h+' 小时';
  var m=Math.max(1,Math.ceil(ms/60000));
  return '免费试用剩余 '+m+' 分钟';
}
function licSetLocked(on){
  var r=document.documentElement,b=document.body;
  if(on){r.classList.add('license-locked');if(b)b.classList.add('license-locked');}
  else{r.classList.remove('license-locked');if(b)b.classList.remove('license-locked');}
}
function licCopy(text,btn){
  function done(){
    if(!btn) return;
    var old=btn.getAttribute('data-old')||btn.innerText;
    btn.setAttribute('data-old',old);
    btn.innerText='已复制';
    setTimeout(function(){btn.innerText=old;},1500);
  }
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
      document.execCommand('copy');document.body.removeChild(ta);done();
    }catch(e){try{window.prompt('请手动复制：',text);}catch(err){}}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else fallback();
}
function copyLicWx(btn){licCopy(LIC_WX,btn);}
function copyLicDev(btn){if(_licState) licCopy(licFmt(_licState.c,4),btn);}
function licFillModal(st,status,dismissible){
  var title=document.getElementById('licModalTitle');
  var hint=document.getElementById('licModalHint');
  var dev=document.getElementById('licDevCode');
  var close=document.getElementById('licCloseBtn');
  var err=document.getElementById('licErr');
  var input=document.getElementById('licCodeInput');
  if(dev) dev.innerText=licFmt(st.c,4);
  if(err && !(_licModalOpen && !dismissible)){err.innerText='';err.className='lic-err';}
  if(input && !dismissible && !_licModalOpen) input.value='';
  if(status.ok){
    if(title) title.innerText='输入激活码开通会员';
    if(hint) hint.innerText='激活码与本设备绑定。开通后有效期从激活时起算。';
  }else if(status.reason==='member'){
    if(title) title.innerText='会员已到期，请联系管理员续费';
    if(hint) hint.innerText='请将您的设备码发给微信客服，获取新的激活码后续费。';
  }else{
    if(title) title.innerText='免费试用已结束，请联系管理员开通';
    if(hint) hint.innerText='请将您的设备码发给微信客服，获取激活码后即可继续使用。';
  }
  if(close){
    if(dismissible) close.classList.add('show');
    else close.classList.remove('show');
  }
  _licBlocking=!dismissible;
}
function licShowModal(dismissible){
  var modal=document.getElementById('licModal');
  var st=_licState||licNewState();
  var status=licStatus(st);
  licFillModal(st,status,!!dismissible);
  if(modal) modal.classList.add('show');
  _licModalOpen=true;
  var input=document.getElementById('licCodeInput');
  if(input) setTimeout(function(){try{input.focus();}catch(e){}},200);
}
function openLicenseModal(){
  var st=_licState;
  var status=st?licStatus(st):{ok:false};
  licShowModal(!!status.ok);
}
function closeLicenseModal(){
  if(_licBlocking) return;
  var modal=document.getElementById('licModal');
  if(modal) modal.classList.remove('show');
  _licModalOpen=false;
  var err=document.getElementById('licErr');
  if(err) err.innerText='';
}
function licRenderBadge(st,status){
  var box=document.getElementById('licBadge');
  if(!box) return;
  if(!status.ok){box.innerHTML='';return;}
  var chip='lic-chip',text='',btn='';
  if(status.reason==='life'){
    chip+=' ok';text='终身会员';
  }else if(status.reason==='paid'){
    chip+=' ok';
    text='已激活 · 有效期至 '+licFmtDate(status.until);
    btn='<button type="button" onclick="openLicenseModal()">续费</button>';
  }else{
    if(status.remain<=6*3600000) chip+=' warn';
    text=licRemainText(status.remain);
    btn='<button type="button" onclick="openLicenseModal()">激活</button>';
  }
  box.innerHTML='<div class="'+chip+'"><span>'+text+'</span>'+btn+'</div>';
}
function licApply(){
  var st=_licState;
  if(!st) return;
  var now=licNow();
  if(st.ls&&now<st.ls-LIC_SKEW_MS) st.tp=1;
  st.ls=Math.max(st.ls||0,now);
  licPersist(st);
  var status=licStatus(st,now);
  licRenderBadge(st,status);
  if(!status.ok){
    licSetLocked(true);
    if(!_licModalOpen) licShowModal(false);
    else licFillModal(st,status,false);
  }else{
    licSetLocked(false);
    if(_licModalOpen&&_licBlocking) closeLicenseModal();
    if(!_licModalOpen){
      var modal=document.getElementById('licModal');
      if(modal) modal.classList.remove('show');
    }
  }
}
async function submitLicenseCode(){
  var input=document.getElementById('licCodeInput');
  var err=document.getElementById('licErr');
  var code=input?input.value:'';
  if(!licNorm(code)){
    if(err){err.className='lic-err';err.innerText='请输入激活码';}
    return;
  }
  var st=_licState;
  if(!st){if(err) err.innerText='设备信息读取失败，请刷新页面后重试';return;}
  var planId=null;
  try{
    var want=licNorm(code),ids=Object.keys(LIC_PLANS),i,gen;
    for(i=0;i<ids.length;i++){
      gen=await licMakeCode(st.c,ids[i]);
      if(licNorm(gen)===want){planId=ids[i];break;}
    }
  }catch(e){
    planId=licMatchPlan(st.c,code);
  }
  if(!planId){
    if(err){err.className='lic-err';err.innerText='激活码不正确，请检查后重试。激活码与设备绑定，请确认已发送正确的设备码。';}
    return;
  }
  var plan=LIC_PLANS[planId];
  var t=licNow();
  st.a={p:planId,t:t,e:plan.days?t+plan.days*24*3600*1000:0};
  st.tp=0;
  st.ls=t;
  _licState=st;
  await licPersist(st);
  if(err){err.className='lic-err lic-okmsg';err.innerText='激活成功，已开通'+plan.label+'会员';}
  _licBlocking=false;
  _licModalOpen=false;
  setTimeout(function(){
    var modal=document.getElementById('licModal');
    if(modal) modal.classList.remove('show');
    licApply();
  },700);
}
async function initLicense(){
  var fromLS=licReadLS();
  var fromCk=licReadCookie();
  var fromIdb=null;
  try{fromIdb=await licReadIDB();}catch(e){}
  var st=licMerge([fromLS,fromCk,fromIdb]);
  if(!st) st=licNewState();
  var now=licNow();
  if(st.ls&&now<st.ls-LIC_SKEW_MS) st.tp=1;
  st.ls=Math.max(st.ls||0,now);
  _licState=st;
  await licPersist(st);
  licApply();
  if(_licTimer) clearInterval(_licTimer);
  _licTimer=setInterval(function(){if(_licState) licApply();},30000);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeLicenseModal();
});

function stopResumeWatch(){
  if(_resumeTimer){clearInterval(_resumeTimer);_resumeTimer=null;}
}
function startResumeWatch(){
  stopResumeWatch();
  if(!('speechSynthesis' in window)) return;
  _resumeTimer=setInterval(function(){
    try{
      if(speechSynthesis.speaking && !speechSynthesis.paused){
        speechSynthesis.pause();
        speechSynthesis.resume();
      }
    }catch(e){}
  },14000);
}
function stopSpeech(){
  _speakToken++;
  _readPaused=false;
  _readQueue=[];
  _readIndex=0;
  _readActive=false;

  document.querySelectorAll('.sent.speaking').forEach(function(el){el.classList.remove('speaking');});
  updateArtReadButtons();

function currentRate(explicit){
  if(typeof explicit==='number' && isFinite(explicit)) return explicit;
  return SPEAK_RATES[_speedMode]||SPEAK_RATES.slow;
}
function applyVoiceToUtterance(u){
  if(_voiceObj){
    try{u.voice=_voiceObj;}catch(e){}
    u.lang=_voiceObj.lang||_voiceLang||'en-US';
  }else{
    u.lang=_voiceLang||'en-US';
  }
  u.pitch=_voicePitch;
}
function speak(text,rateOrOpts){
  if(!text||!('speechSynthesis' in window)) return;
  var opts=(rateOrOpts && typeof rateOrOpts==='object')?rateOrOpts:{rate:rateOrOpts};
  if(!opts.queue){
    stopSpeech();
  }
  var token=opts.token!=null?opts.token:++_speakToken;
  if(!opts.queue) _speakToken=token;
  var u=new SpeechSynthesisUtterance(String(text));
  applyVoiceToUtterance(u);
  u.rate=currentRate(opts.rate);
  u.onend=function(){
    if(opts.onend && token===_speakToken) opts.onend();
  };
  u.onerror=function(){
    if(opts.onend && token===_speakToken) opts.onend();
  };
  if(opts.onstart) u.onstart=opts.onstart;
  startResumeWatch();
  try{speechSynthesis.speak(u);}catch(e){if(opts.onend) opts.onend();}
}

function splitSentences(text){
  text=String(text||'').replace(/\r\n/g,'\n');
  var abbrev='mr mrs ms miss dr prof sr jr vs etc st no jan feb mar apr jun jul aug sep sept oct nov dec vol pp fig figs est inc ltd co univ dept gen col sgt rev cm mm kg km ml lb oz am pm ft in ch approx'.split(' ');
  var abbrevSet={};
  abbrev.forEach(function(w){abbrevSet[w]=1;});
  function isAbbrev(buf){
    var m=buf.match(/([A-Za-z][A-Za-z.]*)\.$/);
    if(!m) return false;
    var raw=m[1], low=raw.toLowerCase();
    if(abbrevSet[low]) return true;
    if(/^(e\.g|i\.e|u\.s|u\.k|a\.m|p\.m|ph\.d|u\.s\.a|d\.c)$/i.test(low)) return true;
    if(/^[A-Z]$/.test(raw)) return true;
    if(/^[A-Z](?:\.[A-Z])+$/.test(raw)) return true;
    return false;
  }
  function splitPara(p){
    var out=[],buf='',i,ch,next;
    for(i=0;i<p.length;i++){
      ch=p[i];
      buf+=ch;
      if(ch!=='.'&&ch!=='!'&&ch!=='?'&&ch!=='…') continue;
      if(ch==='.' && /\d$/.test(buf.slice(0,-1)) && i+1<p.length && /\d/.test(p[i+1])) continue;
      if(ch==='.' && (p[i+1]==='.' || /\.\.$/.test(buf))) continue;
      if((ch==='?'||ch==='!') && (p[i+1]==='?'||p[i+1]==='!')) continue;
      if(ch==='.' && i+1<p.length && /[A-Za-z]/.test(p[i+1]) && p[i+2]==='.') continue;
      if(ch==='.' && isAbbrev(buf)){
        var afterCap=/^\s+[A-Z]/.test(p.slice(i+1));
        var title=/(^|[\s("])(Mr|Mrs|Ms|Miss|Dr|Prof|Sr|Jr|St|Gen|Col|Sgt|Rev|No|Vol|Fig)\.$/i.test(buf);
        var place=/([A-Z]\.)+[A-Z]?\.$/.test(buf); // U.S. U.K. U.S.A.
        if(title || place || !afterCap) continue;
        // e.g. p.m. / a.m. / etc. followed by a capital letter: new sentence
      }
      while(i+1<p.length && /["'”’\)\]）]/.test(p[i+1])){i++;buf+=p[i];}
      next=p[i+1];
      if(next===undefined || /\s/.test(next)){
        var s=buf.trim();
        if(s) out.push(s);
        buf='';
      }
    }
    if(buf.trim()) out.push(buf.trim());
    return out;
  }
  var paras=text.split(/\n+/),groups=[],pi,ss;
  for(pi=0;pi<paras.length;pi++){
    if(!paras[pi].trim()) continue;
    ss=splitPara(paras[pi].trim());
    if(ss.length) groups.push(ss);
  }
  if(!groups.length && text.trim()) groups=[[text.trim()]];
  return groups;
}

function highlightHardWords(text,hard){
  var html=String(text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(!hard) return html;
  Object.keys(hard).sort(function(a,b){return b.length-a.length;}).forEach(function(w){
    var info=hard[w]||{};
    var re=new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','gi');
    html=html.replace(re,function(m){
      return '<span class="hard" data-word="'+escAttr(w)+'" data-ipa="'+escAttr(info.ipa||'')+'" data-cn="'+escAttr(info.cn||'')+'">'+m+'</span>';
    });
  });
  return html;
}
function escAttr(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderArticleBody(article){

function playArticleFrom(start){
  var list=window._artSentences||[];

    if(!_readActive||_readPaused) return;
    if(_readIndex>=_readQueue.length){
      stopSpeech();
      return;
    }
    var i=_readIndex;
    speakSentenceAt(i,function(){
      if(!_readActive||_readPaused) return;
      _readIndex=i+1;

    });
  }
  next();

function voiceLang(v){return String(v.lang||'').replace(/_/g,'-').toLowerCase();}
function voiceIsEn(v){return /^en([-_]|$)/i.test(voiceLang(v))||/(english|en-us|en-gb|en-uk)/i.test(v.name||'');}
function voiceSkip(v){
  return /whisper|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|zarvox|bahh|deranged|bad news|good news|pipe organ|hysterical|novelty|singing|dummy|bender|wobble|reed|junior/i.test(v.name||'');
}
var FEMALE_NAMES=['samantha','victoria','susan','allison','ava','zoe','aria','zira','jenny','michelle','nicky','karen','moira','tessa','fiona','veena','raveena','kate','serena','martha','libby','sonia','hazel','princess','kathy','vicki','emma','joanna','ivy','kendra','kimberly','salli','nicole','olivia','maisie','ana','jane','mary','linda','helen','catherine','heather','zira','aria','siri','fiona','moira','tessa','susan','sonia','libby','melissa','linda','heather','paulina','elsa','alice','amy','lisa'];
var MALE_NAMES=['alex','fred','tom','daniel','nathan','aaron','guy','david','ryan','christopher','bruce','ralph','george','oliver','thomas','ravi','james','matthew','mark','brian','justin','joey','kevin','eric','brandon','richard','benjamin','andrew','arthur','geraint','rishi','gordon','aaron','nathan','tom','fred','daniel','oliver','george','ryan','david','jamie','harry','jack','william','michael','john','peter','robert','steve','nathan'];
function nameHit(name,list){
  var n=' '+name.replace(/[_.]+/g,' ')+' ';
  return list.some(function(x){return new RegExp('[\\s\\-.]'+x+'[\\s\\-.]','i').test(n);});
}
function voiceRegion(v){
  var l=voiceLang(v),n=v.name||'';
  if(/^en-gb|^en-uk/.test(l)||/UK English|United Kingdom|British|en-GB|England/i.test(n)) return 'gb';
  if(/^en-us/.test(l)||/US English|United States|American|en-US/i.test(n)) return 'us';
  if(/^en-au/.test(l)||/Australian|en-AU/i.test(n)) return 'au';
  if(/^en-in/.test(l)||/Indian|en-IN/i.test(n)) return 'in';
  if(/^en-ie/.test(l)||/Irish/i.test(n)) return 'ie';
  if(l.indexOf('en')===0) return 'en';
  return 'other';
}
function voiceGender(v){
  var n=v.name||'';
  if(/female|woman|girl/i.test(n)) return 'f';
  if(/\bmale\b|\bman\b|\bboy\b|\bguy\b/i.test(n) && !/female/i.test(n)) return 'm';
  if(/^Google US English$/i.test(n.trim())) return 'f';
  var f=nameHit(n,FEMALE_NAMES),m=nameHit(n,MALE_NAMES);
  if(f&&!m) return 'f';
  if(m&&!f) return 'm';
  return 'u';
}
function voiceQuality(v){
  var n=v.name||'',s=0;
  if(/natural|enhanced|premium|neural|online/i.test(n)) s+=3;
  if(v.localService) s+=1;
  if(/compact/i.test(n)) s-=1;
  return s;
}
function pickVoiceChoices(){
  var all=[];
  try{all=speechSynthesis.getVoices()||[];}catch(e){all=[];}
  var en=all.filter(function(v){return voiceIsEn(v)&&!voiceSkip(v);});
  function best(pred){
    var pool=en.filter(pred);
    pool.sort(function(a,b){return voiceQuality(b)-voiceQuality(a);});
    return pool[0]||null;
  }
  var used={};
  function take(v){if(!v||used[v.voiceURI||v.name]) return null; used[v.voiceURI||v.name]=1; return v;}
  var usF=take(best(function(v){return voiceRegion(v)==='us'&&voiceGender(v)==='f';}));
  var usM=take(best(function(v){return voiceRegion(v)==='us'&&voiceGender(v)==='m';}));
  var uk=take(best(function(v){return voiceRegion(v)==='gb';}));
  if(!usF) usF=take(best(function(v){return voiceGender(v)==='f';}));
  if(!usM) usM=take(best(function(v){return voiceRegion(v)==='us'&&voiceGender(v)==='m';}));
  if(!uk) uk=take(best(function(v){return voiceRegion(v)==='gb'||voiceRegion(v)==='au'||voiceRegion(v)==='ie';}));
  var choices=[];
  function voiceLabel(v){
    var r=voiceRegion(v),g=voiceGender(v);
    var region=r==='us'?'美式':r==='gb'?'英式':r==='au'?'澳式':r==='ie'?'爱尔兰':r==='in'?'印度':'英语';
    var sex=g==='f'?'女声':g==='m'?'男声':'发音';
    return region+sex;
  }
  if(usF) choices.push({key:'us-f',label:voiceLabel(usF),voice:usF,lang:usF.lang||'en-US',pitch:1.05});
  if(usM) choices.push({key:'us-m',label:voiceLabel(usM),voice:usM,lang:usM.lang||'en-US',pitch:1.0});
  if(uk) choices.push({key:'uk',label:voiceLabel(uk),voice:uk,lang:uk.lang||'en-GB',pitch:1.02});
  if(choices.length<3){
    en.forEach(function(v){
      if(choices.length>=3) return;
      if(used[v.voiceURI||v.name]) return;
      used[v.voiceURI||v.name]=1;
      choices.push({key:'extra-'+(v.voiceURI||v.name),label:voiceLabel(v),voice:v,lang:v.lang||'en-US',pitch:1.05});
    });
  }
  _pitchFallback=false;
  if(choices.length<=1){
    _pitchFallback=true;
    var base=choices[0]?choices[0].voice:null;
    var lang=base?(base.lang||'en-US'):'en-US';
    choices=[
      {key:'pitch-high',label:'音色一 · 偏高',voice:base,lang:lang,pitch:1.2},
      {key:'pitch-mid',label:'音色二 · 自然',voice:base,lang:lang,pitch:1.05},
      {key:'pitch-low',label:'音色三 · 偏低',voice:base,lang:lang,pitch:0.85}
    ];
  }
  _voiceChoices=choices.slice(0,3);
  _voicesReady=all.length>0;
  return _voiceChoices;
}
function applyVoiceKey(key,persist){
  if(!_voiceChoices.length) pickVoiceChoices();
  var ch=_voiceChoices.filter(function(c){return c.key===key;})[0]||_voiceChoices[0];
  if(!ch) return;
  _voiceKey=ch.key;
  _voiceObj=ch.voice||null;
  _voicePitch=ch.pitch||1.05;
  _voiceLang=ch.lang||'en-US';
  if(persist!==false){
    try{localStorage.setItem(VOICE_STORE_KEY,JSON.stringify({key:ch.key,uri:ch.voice?ch.voice.voiceURI:''}));}catch(e){}
  }
}
function loadVoicePrefs(){
  try{
    var s=localStorage.getItem(SPEED_STORE_KEY);
    if(s==='normal'||s==='slow') _speedMode=s;
  }catch(e){}
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem(VOICE_STORE_KEY)||'null');}catch(e){}
  pickVoiceChoices();
  var key='';
  if(saved){
    if(saved.key && _voiceChoices.some(function(c){return c.key===saved.key;})) key=saved.key;
    else if(saved.uri){
      var hit=_voiceChoices.filter(function(c){return c.voice&&c.voice.voiceURI===saved.uri;})[0];
      if(hit) key=hit.key;
    }
  }
  applyVoiceKey(key||(_voiceChoices[0]&&_voiceChoices[0].key)||'',false);
}
function setSpeedMode(mode){
  _speedMode=(mode==='normal')?'normal':'slow';
  try{localStorage.setItem(SPEED_STORE_KEY,_speedMode);}catch(e){}

}

    return '<button type="button" class="pill'+(c.key===_voiceKey?' active':'')+'" data-voice-key="'+escAttr(c.key)+'">'+c.label+'</button>';
  }).join('');
  var hint=_pitchFallback
    ? '当前设备只检测到一种英语发音，已用音调稍作区分。不同手机、电脑上的音色可能不同。'
    : (!_voicesReady ? '正在读取系统发音…' : '');
  box.innerHTML=
    '<span class="vb-lab">发音</span><div class="pills" id="voicePills">'+voicePills+'</div>'+
    '<span class="vb-lab">语速</span><div class="pills" id="speedPills">'+
      '<button type="button" class="pill'+(_speedMode==='slow'?' active':'')+'" data-speed="slow">慢速</button>'+
      '<button type="button" class="pill'+(_speedMode==='normal'?' active':'')+'" data-speed="normal">正常</button>'+
    '</div>'+(hint?'<span class="voice-hint">'+hint+'</span>':'');
}

function shuffleOptions(options,answer){
  var arr=options.map(function(v,i){return {v:v,i:i};});
  var i,j,tmp;
  for(i=arr.length-1;i>0;i--){
    j=Math.floor(Math.random()*(i+1));
    tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  var correct=options[answer];
  return {options:arr.map(function(x){return x.v;}), correct:correct};
}

function selectCat(cat){currentCat=cat;renderWords();}
function filterWords(){
  const q=(document.getElementById('wordSearch').value||'').trim().toLowerCase();
  const data=WORD_DATA[currentLevel]||{};
  let list=currentCat&&data[currentCat]?data[currentCat]:[];
  if(q)list=list.filter(item=>item.w.toLowerCase().includes(q)||(item.cn&&item.cn.includes(q))||(item.ex&&item.ex.toLowerCase().includes(q)));
  const total=Object.values(data).reduce((s,a)=>s+(a?a.length:0),0);
  document.getElementById('wordStats').innerHTML=`<span>当前：${currentLevel==='junior'?'中考':'高考'} · ${currentCat||''} · 本类 ${list.length} 词</span><span style="color:#5eead4">词库总量 ${total} 词</span>`;
  const grid=document.getElementById('wordGrid');
  if(!list.length){grid.innerHTML='<div class="empty">没有找到匹配的单词</div>';return;}
  grid.innerHTML=list.map(item=>`
    <div class="word-card">
      <div class="w-main">${item.w}</div>
      <div class="w-ipa">${item.ipa||''}</div>
      <div class="w-cn">${item.cn||''}</div>
      <div class="w-ex" data-speak="${escAttr(item.ex||'')}">
        <div class="en">${item.ex||''}</div>
        <div class="cn">${item.exCn||''}</div>
        <div class="hint">🔊 点击例句可朗读</div>
      </div>
      <div class="w-actions">
        <button type="button" class="btn btn-play" data-speak="${escAttr(item.w)}" data-rate="0.95">🔊 常速</button>
        <button type="button" class="btn btn-slow" data-speak="${escAttr(item.w)}" data-rate="0.58">🐢 慢速</button>
      </div>
    </div>`).join('');
}

function renderArtList(){
  if(!dataReady)return;
  const list=ARTICLE_DATA[currentLevel]||[];
  const cats=['全部',...new Set(list.map(a=>a.cat).filter(Boolean))];
  document.getElementById('artCatPills').innerHTML=cats.map(c=>`<button class="pill ${c===currentArtCat?'active':''}" onclick="selectArtCat('${c}')">${c}</button>`).join('');
  const filtered=currentArtCat==='全部'?list:list.filter(a=>a.cat===currentArtCat);
  document.getElementById('artStats').innerText=`${currentLevel==='junior'?'中考':'高考'}阶段 · ${currentArtCat} · 共 ${filtered.length} 篇`;
  const box=document.getElementById('artList');
  if(!filtered.length){box.innerHTML='<div class="empty">该分类暂无短文</div>';return;}
  box.innerHTML=filtered.map(a=>`
    <div class="art-card" onclick="openArticle('${a.id}')">
      <div class="t">${a.title}</div>
      <div class="meta">
        <span class="tag words">${a.words||300} 词</span>
        <span class="tag">${a.cat||''}</span>
        ${(a.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
      </div>
    </div>`).join('');
}
function selectArtCat(cat){currentArtCat=cat;renderArtList();}
function openArticle(id){
  const list=ARTICLE_DATA[currentLevel]||[];
  currentArticle=list.find(a=>a.id===id);
  if(!currentArticle)return;
  document.getElementById('listView').style.display='none';
  document.getElementById('detailView').classList.add('active');
  document.getElementById('artTitle').innerText=currentArticle.title;
  stopSpeech();
  renderArticleBody(currentArticle);
  document.getElementById('artTrans').innerText=currentArticle.translation||'';
  userAnswers={};
  const qs=currentArticle.questions||[];
  document.getElementById('qBox').innerHTML=qs.map((q,qi)=>`
    <div class="q-card" id="qcard-${qi}">
      <div class="q-text">${q.q}</div>
      ${(q.options||[]).map((opt,oi)=>`
        <label class="q-opt" id="opt-${qi}-${oi}">
          <input type="radio" name="q${qi}" value="${oi}" onchange="userAnswers[${qi}]=${oi}">
          <span>${opt}</span>
        </label>`).join('')}
    </div>`).join('');
  document.getElementById('scoreBanner').style.display='none';
}
function backToList(){
  stopSpeech();
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('listView').style.display='block';
  currentArticle=null;
}
function showPopup(el){
  document.getElementById('pWord').innerText=el.dataset.word;
  document.getElementById('pIpa').innerText=el.dataset.ipa;
  document.getElementById('pCn').innerText=el.dataset.cn;
  document.getElementById('popup').classList.add('show');
}
function closePopup(){document.getElementById('popup').classList.remove('show');}
function checkAnswers(){
  if(!currentArticle)return;
  const qs=currentArticle.questions||[];
  let correct=0;
  qs.forEach((q,qi)=>{
    const selected=userAnswers[qi];
    (q.options||[]).forEach((_,oi)=>{
      const el=document.getElementById(`opt-${qi}-${oi}`);
      if(!el)return;
      el.classList.remove('selected','correct','wrong');
      if(oi===q.answer)el.classList.add('correct');
      if(selected===oi&&oi!==q.answer)el.classList.add('wrong');
      if(selected===oi)el.classList.add('selected');
    });
    if(selected===q.answer)correct++;
  });
  const total=qs.length,pct=total?Math.round(correct/total*100):0;
  const banner=document.getElementById('scoreBanner');
  banner.style.display='block';
  banner.innerHTML=`得分：${correct} / ${total}（${pct}分）<br><small style="font-weight:600;color:#a7f3d0">绿色为正确答案 · 红色为错选</small>`;
  qs.forEach((q,qi)=>{
    if(userAnswers[qi]!==q.answer&&q.exp){
      const card=document.getElementById(`qcard-${qi}`);
      if(card&&!card.querySelector('.exp')){
        const exp=document.createElement('div');
        exp.className='exp';
        exp.style.cssText='margin-top:8px;font-size:0.8rem;color:#fbbf24;line-height:1.4;';
        exp.innerText='💡 '+q.exp;
        card.appendChild(exp);
      }
    }
  });
}
initLicense();
initSpeechUI();
loadData();

function setListenDiff(diff,btn){
  listenDiff=diff;
  document.querySelectorAll('#listenDiffPills .pill').forEach(b=>b.classList.toggle('active',b.dataset.diff===diff));
  currentListenIndex=0;
  renderListening();
}
function setListenType(type,btn){
  listenType=type;
  document.querySelectorAll('#listenTypePills .pill').forEach(b=>b.classList.toggle('active',b.dataset.type===type));
  currentListenIndex=0;
  renderListening();
}
function getListenItems(){
  const lv=LISTENING_DATA[currentLevel]||{};
  const diff=lv[listenDiff]||{};
  return diff[listenType]||[];
}
function renderListening(){
  if(!dataReady)return;
  const items=getListenItems();
  const stats=document.getElementById('listenStats');
  const listView=document.getElementById('listenListView');
  const detailView=document.getElementById('listenDetailView');
  listView.style.display='block';
  detailView.style.display='none';
  if(!items.length){
    stats.innerText='当前难度/类型暂无题目。';
    document.getElementById('listenTagGrid').innerHTML='<div style="text-align:center;padding:40px;color:#94a8c4;grid-column:1/-1">暂无内容，更新 listening.json 后刷新即可</div>';
    return;
  }
  const typeName={'wordChoice':'听音辩词','sentenceOrder':'句子排序','passage':'短文听力'}[listenType];
  const diffName={'easy':'简单','medium':'较难','hard':'高难'}[listenDiff];
  stats.innerText=`${currentLevel==='junior'?'初中':'高中'} · ${diffName} · ${typeName} · 共 ${items.length} 题（点击下方标签开始）`;
  const grid=document.getElementById('listenTagGrid');
  grid.innerHTML='';
  items.forEach((item,idx)=>{
    const card=document.createElement('div');
    card.className='word-card';
    card.style.cursor='pointer';
    // 列表页绝不显示具体内容，只显示题号和题型
    card.innerHTML=`<div class="w-word" style="font-size:1.05rem">第 ${idx+1} 题</div><div class="w-ipa" style="margin-top:8px;font-size:.85rem">${typeName}</div><div class="w-cn" style="margin-top:6px;color:#64748b;font-size:.8rem">点击开始听力</div>`;
    card.onclick=()=>openListenItem(idx);
    grid.appendChild(card);
  });
}
function openListenItem(idx){
  stopSpeech();
  currentListenIndex=idx;
  const items=getListenItems();
  const item=items[idx];
  document.getElementById('listenListView').style.display='none';
  document.getElementById('listenDetailView').style.display='block';
  if(listenType==='wordChoice') renderWordChoice(item,items);
  else if(listenType==='sentenceOrder') renderSentenceOrder(item,items);
  else renderPassage(item,items);
}
function backToListenList(){
  stopSpeech();
  renderListening();
}
function renderWordChoice(item,items){
  const shuffled=shuffleOptions(item.options,item.answer);
  window._wcCorrect=shuffled.correct;
  const box=document.getElementById('listenContent');
  box.innerHTML='';
  const wrap=document.createElement('div');
  wrap.style.cssText='background:var(--elev);border-radius:16px;padding:18px;margin-bottom:12px';
  const head=document.createElement('div');
  head.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:12px';
  head.innerHTML='<span style="font-weight:800">第 '+(currentListenIndex+1)+' / '+items.length+' 题</span>';
  const play=document.createElement('button');
  play.className='btn-play';
  play.type='button';
  play.innerText='🔊 播放单词';
  bindPlayButton(play,item.audio);
  head.appendChild(play);
  wrap.appendChild(head);
  const optBox=document.createElement('div');
  optBox.id='wcOptions';
  optBox.style.cssText='display:grid;gap:8px';
  shuffled.options.forEach(function(op){
    const btn=document.createElement('button');
    btn.className='pill';
    btn.type='button';
    btn.style.cssText='text-align:left;padding:10px 14px;font-size:.95rem';
    btn.innerText=op;
    btn.dataset.val=op;
    btn.onclick=function(){
      document.querySelectorAll('#wcOptions .pill').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
    };
    optBox.appendChild(btn);
  });
  wrap.appendChild(optBox);
  const check=document.createElement('button');
  check.className='check-btn';
  check.type='button';
  check.style.marginTop='14px';
  check.innerText='提交答案';
  check.onclick=checkWordChoice;
  wrap.appendChild(check);
  const res=document.createElement('div');
  res.id='wcResult';
  res.style.marginTop='10px';
  wrap.appendChild(res);
  const nav=document.createElement('div');
  nav.style.cssText='display:flex;gap:8px;justify-content:center';
  nav.innerHTML='<button type="button" class="pill" onclick="prevListen()">← 上一题</button><button type="button" class="pill" onclick="nextListen()">下一题 →</button>';
  box.appendChild(wrap);
  box.appendChild(nav);
}
function checkWordChoice(){
  const sel=document.querySelector('#wcOptions .pill.active');
  const res=document.getElementById('wcResult');
  const correct=window._wcCorrect;
  if(!sel){res.innerHTML='<span style="color:#fbbf24">请先选择一个选项</span>';return;}
  const chosen=sel.dataset.val;
  document.querySelectorAll('#wcOptions .pill').forEach(function(b){
    if(b.dataset.val===correct) b.style.borderColor='#5eead4';
    if(b===sel && chosen!==correct) b.style.borderColor='#f87171';
  });
  if(chosen===correct){
    res.innerHTML='<span style="color:#5eead4;font-weight:800">✓ 正确！</span> '+ (getListenItems()[currentListenIndex].exp||'');
  }else{
    res.innerHTML='<span style="color:#f87171;font-weight:800">✗ 错误</span> 正确答案是：'+correct;
  }
}
function renderSentenceOrder(item,items){
  const shuffled=[...item.words].sort(function(){return Math.random()-0.5;});
  const box=document.getElementById('listenContent');
  box.innerHTML='';
  const wrap=document.createElement('div');
  wrap.style.cssText='background:var(--elev);border-radius:16px;padding:18px;margin-bottom:12px';
  const head=document.createElement('div');
  head.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:12px';
  head.innerHTML='<span style="font-weight:800">第 '+(currentListenIndex+1)+' / '+items.length+' 题</span>';
  const play=document.createElement('button');
  play.className='btn-play';
  play.type='button';
  play.innerText='🔊 播放句子';
  bindPlayButton(play,item.audio);
  head.appendChild(play);
  wrap.appendChild(head);
  const hint=document.createElement('div');
  hint.style.cssText='margin-bottom:8px;color:#94a8c4;font-size:.85rem';
  hint.innerText='点击单词按顺序排列：';
  wrap.appendChild(hint);
  const sel=document.createElement('div');
  sel.id='soSelected';
  sel.style.cssText='min-height:46px;background:var(--bg);border-radius:12px;padding:8px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px';
  const pool=document.createElement('div');
  pool.id='soPool';
  pool.style.cssText='display:flex;flex-wrap:wrap;gap:6px';
  wrap.appendChild(sel);
  wrap.appendChild(pool);
  const check=document.createElement('button');
  check.className='check-btn';
  check.type='button';
  check.style.marginTop='14px';
  check.innerText='提交答案';
  check.onclick=checkSentenceOrder;
  wrap.appendChild(check);
  const res=document.createElement('div');
  res.id='soResult';
  res.style.marginTop='10px';
  wrap.appendChild(res);
  const nav=document.createElement('div');
  nav.style.cssText='display:flex;gap:8px;justify-content:center';
  nav.innerHTML='<button type="button" class="pill" onclick="prevListen()">← 上一题</button><button type="button" class="pill" onclick="nextListen()">下一题 →</button>';
  box.appendChild(wrap);
  box.appendChild(nav);
  shuffled.forEach(function(w){
    const b=document.createElement('button');
    b.className='pill';
    b.type='button';
    b.innerText=w;
    b.onclick=function(){
      if(b.parentElement===pool){sel.appendChild(b);}
      else{pool.appendChild(b);}
    };
    pool.appendChild(b);
  });
  window._currentSentence=item;
}
function checkSentenceOrder(){
  const sel=document.getElementById('soSelected');
  const chosen=[...sel.querySelectorAll('.pill')].map(function(b){return b.innerText;});
  const correct=window._currentSentence.words;
  const res=document.getElementById('soResult');
  if(chosen.join(' ')===correct.join(' ')){
    res.innerHTML='<span style="color:#5eead4;font-weight:800">✓ 正确！</span> '+ (window._currentSentence.exp||'');
  }else{
    res.innerHTML='<span style="color:#f87171;font-weight:800">✗ 错误</span> 正确顺序：'+correct.join(' ');
  }
}
function renderPassage(item,items){
  const box=document.getElementById('listenContent');
  box.innerHTML='';
  const wrap=document.createElement('div');
  wrap.style.cssText='background:var(--elev);border-radius:16px;padding:18px;margin-bottom:12px';
  const head=document.createElement('div');
  head.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px';
  const title=document.createElement('span');
  title.style.fontWeight='800';
  title.innerText=(item.title||'短文听力')+' · 第 '+(currentListenIndex+1)+'/'+items.length;
  const actions=document.createElement('div');
  const play=document.createElement('button');
  play.className='btn-play';
  play.type='button';
  play.innerText='🔊 播放短文';
  play.addEventListener('click',function(){
    const text=item.audio||item.transcript||'';
    const groups=splitSentences(text);
    const sents=[];
    groups.forEach(function(g){g.forEach(function(x){sents.push(x);});});
    if(!sents.length){speak(text);return;}
    stopSpeech();
    _speakToken++;
    startResumeWatch();
    var i=0;
    function next(){
      if(i>=sents.length){stopResumeWatch();return;}
      var cur=i++;
      speak(sents[cur],{queue:true,token:_speakToken,onend:next});
    }
    next();
  });
  const tog=document.createElement('button');
  tog.className='btn-slow';
  tog.type='button';
  tog.innerText='📄 显示/隐藏原文';
  const trans=document.createElement('div');
  trans.id='transcriptBox';
  trans.style.cssText='display:none;background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px;font-size:.9rem;line-height:1.6';
  trans.innerText=item.transcript||item.audio||'';
  tog.addEventListener('click',function(){
    trans.style.display=trans.style.display==='none'?'block':'none';
  });
  actions.appendChild(play);
  actions.appendChild(document.createTextNode(' '));
  actions.appendChild(tog);
  head.appendChild(title);
  head.appendChild(actions);
  wrap.appendChild(head);
  wrap.appendChild(trans);
  window._pqCorrect=[];
  (item.questions||[]).forEach(function(q,qi){
    const sh=shuffleOptions(q.options,q.answer);
    window._pqCorrect[qi]=sh.correct;
    const qdiv=document.createElement('div');
    qdiv.style.cssText='margin:12px 0;padding:10px;background:var(--bg);border-radius:12px';
    const qt=document.createElement('div');
    qt.style.cssText='font-weight:700;margin-bottom:6px';
    qt.innerText=(qi+1)+'. '+q.q;
    const opbox=document.createElement('div');
    opbox.id='pq'+qi;
    sh.options.forEach(function(op){
      const b=document.createElement('button');
      b.className='pill';
      b.type='button';
      b.style.cssText='display:block;width:100%;text-align:left;margin:4px 0;padding:8px 12px';
      b.innerText=op;
      b.dataset.val=op;
      b.onclick=function(){
        opbox.querySelectorAll('.pill').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active');
      };
      opbox.appendChild(b);
    });
    qdiv.appendChild(qt);
    qdiv.appendChild(opbox);
    wrap.appendChild(qdiv);
  });
  const check=document.createElement('button');
  check.className='check-btn';
  check.type='button';
  check.innerText='提交答案';
  check.onclick=checkPassage;
  wrap.appendChild(check);
  const res=document.createElement('div');
  res.id='pResult';
  res.style.marginTop='10px';
  wrap.appendChild(res);
  const nav=document.createElement('div');
  nav.style.cssText='display:flex;gap:8px;justify-content:center';
  nav.innerHTML='<button type="button" class="pill" onclick="prevListen()">← 上一题</button><button type="button" class="pill" onclick="nextListen()">下一题 →</button>';
  box.appendChild(wrap);
  box.appendChild(nav);
  window._currentPassage=item;
}
function checkPassage(){
  const item=window._currentPassage;
  let correct=0;
  (item.questions||[]).forEach(function(q,qi){
    const sel=document.querySelector('#pq'+qi+' .pill.active');
    const ans=window._pqCorrect[qi];
    if(sel && sel.dataset.val===ans) correct++;
  });
  const res=document.getElementById('pResult');
  res.innerHTML='<span style="color:#5eead4;font-weight:800">得分：'+correct+' / '+item.questions.length+'</span>';
  (item.questions||[]).forEach(function(q,qi){
    const div=document.getElementById('pq'+qi);
    const sel=div.querySelector('.pill.active');
    const ans=window._pqCorrect[qi];
    div.querySelectorAll('.pill').forEach(function(b){
      if(b.dataset.val===ans) b.style.borderColor='#5eead4';
      if(sel && b===sel && b.dataset.val!==ans) b.style.borderColor='#f87171';
    });
  });
}
function nextListen(){
  const items=getListenItems();
  if(currentListenIndex<items.length-1){openListenItem(currentListenIndex+1);}
}
function prevListen(){
  if(currentListenIndex>0){openListenItem(currentListenIndex-1);}
}

</script>
